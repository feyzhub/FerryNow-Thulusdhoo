          { id: "r9", time: "17:30", time24: "17:30", route: "THULUSDHOO_TO_MALE", departure: "Thulusdhoo", destination: "Malé" },

        ],

          { id: "rf2", time: "16:00", time24: "16:00", route: "MALE_TO_THULUSDHOO", departure: "Malé", destination: "Thulusdhoo" },

      },
      {
        id: "riverspeed",

          { id: "rv9", time: "18:30", time24: "18:30", route: "THULUSDHOO_TO_MALE", departure: "Thulusdhoo", destination: "Malé" },
        ],
        fridaySchedule: [
          { id: "rvf1", time: "09:30", time24: "09:30", route: "MALE_TO_THULUSDHOO", departure: "Malé", destination: "Thulusdhoo" },
          { id: "rvf2", time: "15:00", time24: "15:00", route: "MALE_TO_THULUSDHOO", departure: "Malé", destination: "Thulusdhoo" },
          { id: "rvf3", time: "21:00", time24: "21:00", route: "MALE_TO_THULUSDHOO", departure: "Malé", destination: "Thulusdhoo" },
          { id: "rvf4", time: "08:00", time24: "08:00", route: "THULUSDHOO_TO_MALE", departure: "Thulusdhoo", destination: "Malé" },
          { id: "rvf5", time: "14:00", time24: "14:00", route: "THULUSDHOO_TO_MALE", departure: "Thulusdhoo", destination: "Malé" },
        ]
      },
    ];

    const getDepartureStatus = (time24, nextFerryTracker, now) => {
      const currentMinutes = now.getHours() * 60 + now.getMinutes();
      const [hours, minutes] = time24.split(':').map(Number);
      const itemMinutes = hours * 60 + minutes;

      if (itemMinutes < currentMinutes) {
        return { 
          status: 'Departed', 
          isNext: false, 
          style: 'bg-slate-100 text-slate-400 border-slate-200' 
        };
      } else if (!nextFerryTracker.found) {
        nextFerryTracker.found = true;
        return { 
          status: 'Next Ferry', 
          isNext: true, 
          style: 'bg-emerald-500/10 text-emerald-600 border-emerald-500/30 font-bold' 
        };
      } else {
        return { 
          status: 'Upcoming', 
          isNext: false, 
          style: 'bg-sky-50 text-sky-600 border-sky-200' 
        };
      }
    };

    // ==========================================
    // 2. SCHEDULE MODAL COMPONENT
    // ==========================================
    const ScheduleModal = ({ operator, isFriday, onClose }) => {
      if (!operator) return null;
      
      const [filterRoute, setFilterRoute] = React.useState('ALL');
      const rawSchedule = isFriday ? operator.fridaySchedule : operator.regularSchedule;

      const modalSchedule = React.useMemo(() => {
        if (filterRoute === 'ALL') return rawSchedule;
        return rawSchedule.filter((item) => item.route === filterRoute);
      }, [rawSchedule, filterRoute]);

      return (
        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 bg-black/60 backdrop-blur-sm transition-opacity">
          <div className="relative w-full max-w-md bg-white rounded-t-3xl sm:rounded-3xl shadow-2xl overflow-hidden text-slate-800 border border-slate-100 max-h-[85vh] flex flex-col">
            
            <div className="p-5 border-b border-slate-100 bg-slate-50 flex items-start justify-between">
              <div>
                <span className="text-[10px] uppercase font-bold tracking-wider text-sky-600 bg-sky-100 px-2.5 py-0.5 rounded-full">
                  {operator.tag}
                </span>
                <h2 className="text-xl font-black text-slate-900 mt-1">{operator.name}</h2>
                <p className="text-xs text-slate-500 mt-0.5">{operator.description}</p>
              </div>
              <button
                onClick={onClose}
                className="w-8 h-8 rounded-full bg-slate-200/60 flex items-center justify-center text-slate-500 hover:text-slate-800 transition-colors"
              >
                ✕
              </button>
            </div>

            <div className="p-5 overflow-y-auto space-y-4">
              <div className="grid grid-cols-2 gap-3">
                <div className="bg-slate-50 p-3 rounded-2xl border border-slate-100">
                  <span className="text-slate-400 block text-[10px] uppercase font-bold">One Way</span>
                  <span className="font-extrabold text-emerald-600 text-base">{operator.fareOneWay}</span>
                </div>
                <div className="bg-slate-50 p-3 rounded-2xl border border-slate-100">
                  <span className="text-slate-400 block text-[10px] uppercase font-bold">Roundtrip</span>
                  <span className="font-extrabold text-sky-600 text-base">{operator.fareRoundTrip}</span>
                </div>
              </div>

              <div className="space-y-2 bg-slate-50 p-3.5 rounded-2xl border border-slate-100 text-xs">
                <div>
                  <span className="text-slate-400 block text-[10px] uppercase font-bold mb-0.5">Hotline Contacts</span>
                  <div className="flex gap-2">
                    {operator.booking.map((phone, i) => (
                      <a key={i} href={`tel:${phone}`} className="font-bold text-slate-800 bg-white px-2.5 py-1 rounded-lg border border-slate-200 hover:border-sky-500 transition-colors">
                        📞 {phone}
                      </a>
                    ))}
                  </div>
                </div>
                {operator.website && (
                  <div className="pt-1">
                    <span className="text-slate-400 font-medium">Website: </span>
                    <a href={`https://${operator.website}`} target="_blank" rel="noreferrer" className="text-sky-600 font-bold underline">
                      {operator.website}
                    </a>
                  </div>
                )}
              </div>

              <div className="flex gap-1 bg-slate-100 p-1 rounded-xl text-[11px] font-bold">
                <button
                  onClick={() => setFilterRoute('ALL')}
                  className={`flex-1 py-1.5 rounded-lg transition-all ${filterRoute === 'ALL' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-800'}`}
                >
                  All Routes
                </button>
                <button
                  onClick={() => setFilterRoute('MALE_TO_THULUSDHOO')}

                >
                  Thulus → Malé
                </button>
              </div>

              <div className="space-y-2">
                <div className="flex justify-between items-center text-[10px] font-bold uppercase tracking-wider text-slate-400">
                  <span>Timetable</span>
                  {isFriday && <span className="text-amber-600 font-semibold">(Friday Schedule)</span>}
                </div>

                {modalSchedule && modalSchedule.length > 0 ? (
                  modalSchedule.map((item) => (
                    <div key={item.id} className="flex items-center justify-between p-3 rounded-xl bg-slate-50 border border-slate-100">
                      <span className="text-sm font-extrabold text-slate-800">{item.time}</span>
                      <span className="text-xs font-semibold text-slate-500">{item.departure} → {item.destination}</span>
                    </div>
                  ))
                ) : (
                  <p className="text-xs text-slate-400 py-4 text-center">No departures scheduled for this route.</p>

              </div>

                className="w-full py-2.5 text-xs font-bold text-white bg-slate-900 rounded-xl hover:bg-slate-800 transition-colors shadow-sm"
              >
                Done
              </button>
            </div>
          </div>
        </div>
      );
    };

    // ==========================================
    // 3. MAIN APP COMPONENT
    // ==========================================
    function App() {
      const [selectedOperator, setSelectedOperator] = React.useState(null);
      const [activeRoute, setActiveRoute] = React.useState('MALE_TO_THULUSDHOO');
      const [now, setNow] = React.useState(new Date());

      React.useEffect(() => {
        const timer = setInterval(() => setNow(new Date()), 1000);
        return () => clearInterval(timer);
      }, []);

      const isFriday = now.getDay() === 5;

      const formattedClock = now.toLocaleTimeString('en-US', {
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
      });

      const formattedDate = now.toLocaleDateString('en-US', {
        weekday: 'short',
        month: 'short',
        day: 'numeric'
      });

      const fullDailySchedule = React.useMemo(() => {
        let trips = [];
        FERRY_OPERATORS.forEach((operator) => {
          const scheduleList = isFriday ? operator.fridaySchedule : operator.regularSchedule;
          scheduleList.forEach((trip) => {
            trips.push({
              ...trip,
              operatorName: operator.name,
              operatorId: operator.id
            });
          });
        });

        const filtered = trips.filter((t) => t.route === activeRoute);
        return filtered.sort((a, b) => a.time24.localeCompare(b.time24));
      }, [activeRoute, isFriday]);

      const nextFerryTracker = { found: false };
      const processedSchedule = fullDailySchedule.map((item) => {
        const { status, isNext, style } = getDepartureStatus(item.time24, nextFerryTracker, now);
        return { ...item, status, isNext, style };
      });

      const nextAvailableFerry = processedSchedule.find((item) => item.isNext);

      const countdownString = React.useMemo(() => {
        if (!nextAvailableFerry) return null;
        const [hours, minutes] = nextAvailableFerry.time24.split(':').map(Number);
        const target = new Date(now);
        target.setHours(hours, minutes, 0, 0);

        const diffMs = target - now;
        if (diffMs <= 0) return "Departing Now";

        const diffMins = Math.floor(diffMs / 60000);
        const hrs = Math.floor(diffMins / 60);
        const mins = diffMins % 60;
        const secs = Math.floor((diffMs % 60000) / 1000);

        if (hrs > 0) {
          return `Departs in ${hrs}h ${mins}m ${secs}s`;
        }
        return `Departs in ${mins}m ${secs}s`;
      }, [nextAvailableFerry, now]);

      return (
        <div className="bg-white sm:rounded-[36px] shadow-xl border border-slate-100 min-h-screen sm:min-h-[840px] p-5 sm:p-6 flex flex-col justify-between space-y-5 overflow-hidden">
          
          <div className="space-y-5">
            <div className="flex items-center justify-between pt-2 px-1">
              <div>
                <h1 className="text-2xl font-black text-slate-900 tracking-tight">Hello</h1>
                <p className="text-xs font-semibold text-slate-400">{formattedDate} {isFriday && '• Friday'}</p>
              </div>
              <div className="text-right bg-slate-50 border border-slate-100 px-3.5 py-1.5 rounded-2xl shadow-sm">
                <span className="text-sm font-black text-slate-800 tracking-wider font-mono">{formattedClock}</span>
              </div>
            </div>

            <div className="bg-[#0b1329] text-white p-6 rounded-3xl shadow-xl relative overflow-hidden flex flex-col items-center justify-center text-center min-h-[160px] border border-slate-800">
              <span className="px-3 py-1 rounded-full bg-sky-500/10 border border-sky-400/30 text-sky-400 text-[10px] font-extrabold tracking-widest uppercase mb-2">
                NEXT AVAILABLE FERRY
              </span>

              <h3 className="text-sky-300 font-bold text-sm tracking-wide">
                {nextAvailableFerry ? nextAvailableFerry.operatorName : "No More Ferries Today"}
              </h3>

              <div className="text-5xl font-black tracking-tight text-white my-1">
                {nextAvailableFerry ? nextAvailableFerry.time : "--:--"}
              </div>

              <div className="mt-2 inline-flex items-center px-3.5 py-1 rounded-full bg-emerald-500/20 border border-emerald-400/40 text-emerald-300 text-xs font-semibold">
                {countdownString || "Service Completed for Today"}
              </div>
            </div>

            <div className="bg-slate-100 p-1 rounded-2xl flex gap-1 border border-slate-200/60">
              <button
                onClick={() => setActiveRoute('MALE_TO_THULUSDHOO')}
                className={`flex-1 py-2.5 text-xs font-bold rounded-xl transition-all ${
                  activeRoute === 'MALE_TO_THULUSDHOO'
                    ? 'bg-white text-slate-900 shadow-md'
                    : 'text-slate-500 hover:text-slate-800'
                }`}
              >
                Malé → Thulusdhoo
              </button>
              <button
                onClick={() => setActiveRoute('THULUSDHOO_TO_MALE')}
                className={`flex-1 py-2.5 text-xs font-bold rounded-xl transition-all ${
                  activeRoute === 'THULUSDHOO_TO_MALE'
                    ? 'bg-white text-slate-900 shadow-md'
                    : 'text-slate-500 hover:text-slate-800'
                }`}
              >
                Thulusdhoo → Malé
              </button>
            </div>

            <div className="grid grid-cols-2 gap-3">
              {FERRY_OPERATORS.map((op) => {
                const isSelected = selectedOperator?.id === op.id;
                const hasUpcoming = processedSchedule.some(
                  (s) => s.operatorId === op.id && s.status !== 'Departed'
                );

                return (
                  <div
                    key={op.id}
                    onClick={() => setSelectedOperator(op)}
                    className={`p-4 rounded-2xl border transition-all cursor-pointer flex flex-col justify-between h-28 relative ${
                      isSelected
                        ? 'bg-slate-900 text-white border-slate-900 shadow-lg scale-[1.02]'
                        : 'bg-slate-50 hover:bg-slate-100/80 text-slate-800 border-slate-100 shadow-sm'
                    }`}
                  >
                    <div className="flex justify-between items-start">
                      <div className={`w-8 h-8 rounded-full flex items-center justify-center font-bold text-xs ${
                        isSelected ? 'bg-slate-800 text-white' : 'bg-white text-slate-700 shadow-sm'
                      }`}>
                        🚢
                      </div>
                      <span className={`w-2.5 h-2.5 rounded-full ${hasUpcoming ? 'bg-sky-500' : 'bg-slate-300'}`}></span>
                    </div>

                    <div>
                      <h4 className="font-extrabold text-sm leading-tight">{op.name}</h4>
                      <p className={`text-[11px] font-medium mt-0.5 ${isSelected ? 'text-slate-400' : 'text-slate-500'}`}>
                        From {op.fareOneWay}
                      </p>
                    </div>
                  </div>
                );
              })}

              <div className="p-4 rounded-2xl border bg-slate-50 text-slate-800 border-slate-100 shadow-sm flex flex-col justify-between h-28">
                <div className="flex justify-between items-start">
                  <div className="w-8 h-8 rounded-full bg-white text-slate-700 shadow-sm flex items-center justify-center font-bold text-xs">
                    ℹ️
                  </div>
                  <span className="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
                </div>
                <div>
                  <h4 className="font-extrabold text-sm leading-tight">Ticket Info</h4>
                  <p className="text-[11px] font-medium text-slate-500 mt-0.5">Average: MVR 175-200</p>
                </div>
              </div>
            </div>

            <div className="space-y-2.5 pt-1">
              <div className="flex items-center justify-between px-1">
                <span className="text-xs font-extrabold uppercase tracking-wider text-slate-400">
                  Full Schedule Today
                </span>
                <span className="text-[11px] font-bold text-sky-600">
                  {processedSchedule.length} Trips
                </span>
              </div>

              <div className="space-y-2 max-h-60 overflow-y-auto pr-0.5">
                {processedSchedule.length > 0 ? (
                  processedSchedule.map((item) => (
                    <div
                      key={item.id}
                      className={`flex items-center justify-between p-3.5 rounded-2xl border transition-all ${
                        item.status === 'Departed'
                          ? 'bg-slate-50/60 border-slate-100 opacity-60'
                          : item.isNext
                          ? 'bg-sky-50/50 border-sky-300 shadow-sm'
                          : 'bg-slate-50 border-slate-100'
                      }`}
                    >
                      <div className="flex items-center gap-3">
                        <span className="text-base font-black text-slate-900 font-mono">
                          {item.time}
                        </span>
                        <div>
                          <p className="text-xs font-extrabold text-slate-800 leading-none">
                            {item.operatorName}
                          </p>
                          <p className="text-[10px] font-semibold text-slate-400 mt-1">
                            {item.departure} → {item.destination}
                          </p>
                        </div>
                      </div>

                      <span className={`px-2.5 py-1 text-[10px] font-bold rounded-lg border ${item.style}`}>
                        {item.status}
                      </span>
                    </div>
                  ))
                ) : (
                  <div className="p-6 text-center bg-slate-50 rounded-2xl border border-slate-100 text-xs text-slate-400">
                    No departures available for this route today.
                  </div>
                )}
              </div>
            </div>

          </div>

          <ScheduleModal
            operator={selectedOperator}
            isFriday={isFriday}
            onClose={() => setSelectedOperator(null)}
          />

        </div>
      );
    }

    // ==========================================
    // 4. RENDER REACT APP
    // ==========================================
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
