<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thulusdhoo Ferry Finder</title>

  <!-- PWA Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b0f19">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FerryFinder">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(22, 30, 49, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #38bdf8;
      --primary-glow: rgba(56, 189, 248, 0.25);
      --text: #f8fafc;
      --subtext: #94a3b8;
      --accent: #34d399;
      --accent-glow: rgba(52, 211, 153, 0.15);
      --past-opacity: 0.35;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.12), transparent 40%),
        radial-gradient(circle at 100% 100%, rgba(52, 211, 153, 0.08), transparent 40%);
      color: var(--text);
      margin: 0;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      user-select: none;
    }

    .container {
      width: 100%;
      max-width: 440px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0 0 6px 0;
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #ffffff 30%, var(--subtext));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      color: var(--subtext);
      margin: 0;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.01em;
    }

    .route-selector {
      display: flex;
      background: rgba(15, 23, 42, 0.8);
      padding: 4px;
      border-radius: 14px;
      border: 1px solid var(--card-border);
      margin-bottom: 20px;
      backdrop-filter: blur(12px);
    }

    .route-btn {
      flex: 1;
      padding: 12px 10px;
      border: none;
      background: transparent;
      color: var(--subtext);
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .route-btn.active {
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      color: #0f172a;
      box-shadow: 0 4px 15px var(--primary-glow);
    }

    .hero-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 24px 20px;
      text-align: center;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
      margin-bottom: 28px;
      position: relative;
      overflow: hidden;
    }

    .hero-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 60%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--primary), transparent);
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: var(--primary);
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      margin-bottom: 14px;
      text-transform: uppercase;
    }

    .time-large {
      font-size: 3.2rem;
      font-weight: 800;
      margin: 4px 0;
      color: #ffffff;
      letter-spacing: -0.03em;
      text-shadow: 0 0 30px var(--primary-glow);
    }

    .operator-name {
      font-size: 1.15rem;
      color: var(--primary);
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .countdown {
      display: inline-block;
      font-size: 0.88rem;
      color: var(--accent);
      background: var(--accent-glow);
      padding: 6px 14px;
      border-radius: 12px;
      margin-top: 12px;
      font-weight: 600;
    }

    .section-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--subtext);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 14px;
      padding-left: 4px;
    }

    .schedule-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .schedule-item {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(12px);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .schedule-item.past {
      opacity: var(--past-opacity);
      filter: grayscale(0.5);
    }

    .item-time {
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: -0.02em;
      color: #ffffff;
    }

    .item-op {
      font-size: 0.82rem;
      color: var(--subtext);
      margin-top: 2px;
      font-weight: 500;
    }

    .status-pill {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 8px;
    }

    .status-pill.scheduled {
      background: rgba(56, 189, 248, 0.1);
      color: var(--primary);
    }

    .status-pill.departed {
      background: rgba(148, 163, 184, 0.1);
      color: var(--subtext);
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Thulusdhoo Ferry Finder</h1>
    <p class="subtitle" id="current-day-time">Loading time...</p>
  </header>

  <div class="route-selector">
    <button class="route-btn active" id="btn-male" onclick="setDirection('MALE_TO_THULUSDHOO')">Malé → Thulusdhoo</button>
    <button class="route-btn" id="btn-thulusdhoo" onclick="setDirection('THULUSDHOO_TO_MALE')">Thulusdhoo → Malé</button>
  </div>

  <div class="hero-card" id="hero-card">
    <div class="hero-badge">NEXT AVAILABLE FERRY</div>
    <div class="operator-name" id="hero-op">Searching...</div>
    <div class="time-large" id="hero-time">--:--</div>
    <div class="countdown" id="hero-countdown">Checking schedule...</div>
  </div>

  <div class="section-title">Today's Timetable</div>
  <div class="schedule-list" id="upcoming-list"></div>
</div>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(() => console.log('Service Worker Registered'))
        .catch((err) => console.error('SW Registration Failed:', err));
    });
  }

  const SCHEDULES = {
    THULUSDHOO_TO_MALE: [
      { time: "08:00", op: "River Speed" },
      { time: "08:00", op: "Refcool Marine" },
      { time: "08:00", op: "Tharika Express" },
      { time: "10:15", op: "Tharika Express", exceptFriday: true },
      { time: "10:30", op: "River Speed", exceptFriday: true },
      { time: "10:30", op: "Refcool Marine", exceptFriday: true },
      { time: "14:00", op: "Refcool Marine", fridayTime: "14:30" },
      { time: "14:15", op: "Tharika Express" },
      { time: "14:30", op: "River Speed", fridayTime: "15:00" },
      { time: "17:00", op: "Refcool Marine" },
      { time: "17:00", op: "Tharika Express" },
      { time: "17:30", op: "River Speed" },
      { time: "19:30", op: "River Speed" },
      { time: "20:00", op: "Refcool Marine" },
      { time: "20:00", op: "Tharika Express" }
    ],
    MALE_TO_THULUSDHOO: [
      { time: "09:15", op: "Refcool Marine" },
      { time: "09:15", op: "Tharika Express" },
      { time: "09:20", op: "River Speed" },
      { time: "12:15", op: "Tharika Express", exceptFriday: true },
      { time: "12:20", op: "River Speed", exceptFriday: true },
      { time: "12:30", op: "Refcool Marine", exceptFriday: true },
      { time: "15:30", op: "Refcool Marine" },
      { time: "16:00", op: "Tharika Express" },
      { time: "16:20", op: "River Speed" },
      { time: "18:30", op: "Refcool Marine" },
      { time: "18:30", op: "Tharika Express" },
      { time: "20:20", op: "River Speed" },
      { time: "22:00", op: "Refcool Marine" },
      { time: "22:15", op: "River Speed" },
      { time: "22:15", op: "Tharika Express" }
    ]
  };

  let currentDirection = 'MALE_TO_THULUSDHOO';

  function setDirection(dir) {
    currentDirection = dir;
    document.getElementById('btn-male').classList.toggle('active', dir === 'MALE_TO_THULUSDHOO');
    document.getElementById('btn-thulusdhoo').classList.toggle('active', dir === 'THULUSDHOO_TO_MALE');
    updateApp();
  }

  function getActiveSchedules(direction) {
    const now = new Date();
    const isFriday = now.getDay() === 5;

    const rawList = SCHEDULES[direction];
    const activeList = [];

    rawList.forEach(item => {
      if (isFriday && item.exceptFriday) return;

      let departureTime = item.time;
      if (isFriday && item.fridayTime) {
        departureTime = item.fridayTime;
      }

      activeList.push({
        operator: item.op,
        time: departureTime
      });
    });

    return activeList.sort((a, b) => a.time.localeCompare(b.time));
  }

  function updateApp() {
    const now = new Date();
    const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    
    document.getElementById('current-day-time').innerText = 
      `${days[now.getDay()]}, ${now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;

    const currentMinutes = now.getHours() * 60 + now.getMinutes();
    const schedule = getActiveSchedules(currentDirection);

    let nextFerry = null;
    let upcoming = [];

    schedule.forEach(item => {
      const [h, m] = item.time.split(':').map(Number);
      const itemMinutes = h * 60 + m;

      if (itemMinutes > currentMinutes) {
        if (!nextFerry) nextFerry = { ...item, minutesDiff: itemMinutes - currentMinutes };
        upcoming.push({ ...item, isPast: false });
      } else {
        upcoming.push({ ...item, isPast: true });
      }
    });

    if (nextFerry) {
      document.getElementById('hero-op').innerText = nextFerry.operator;
      document.getElementById('hero-time').innerText = format12hr(nextFerry.time);
      
      const hrs = Math.floor(nextFerry.minutesDiff / 60);
      const mins = nextFerry.minutesDiff % 60;
      let countdownText = "Departs in ";
      if (hrs > 0) countdownText += `${hrs} hr `;
      countdownText += `${mins} mins`;
      
      document.getElementById('hero-countdown').innerText = countdownText;
    } else {
      document.getElementById('hero-op').innerText = "No more ferries today";
      document.getElementById('hero-time').innerText = "Tomorrow";
      document.getElementById('hero-countdown').innerText = "Check back in the morning";
    }

    const listContainer = document.getElementById('upcoming-list');
    listContainer.innerHTML = '';
    
    upcoming.forEach(item => {
      const div = document.createElement('div');
      div.className = `schedule-item ${item.isPast ? 'past' : ''}`;
      div.innerHTML = `
        <div>
          <div class="item-time">${format12hr(item.time)}</div>
          <div class="item-op">${item.operator}</div>
        </div>
        <div class="status-pill ${item.isPast ? 'departed' : 'scheduled'}">
          ${item.isPast ? 'Departed' : 'Scheduled'}
        </div>
      `;
      listContainer.appendChild(div);
    });
  }

  function format12hr(timeStr) {
    const [h, m] = timeStr.split(':').map(Number);
    const ampm = h >= 12 ? 'PM' : 'AM';
    const hour12 = h % 12 || 12;
    return `${hour12}:${m < 10 ? '0' : ''}${m} ${ampm}`;
  }

  updateApp();
  setInterval(updateApp, 30000);
</script>
</body>
</html>
