          { id: "r9", time: "17:30", time24: "17:30", route: "THULUSDHOO_TO_MALE", departure: "Thulusdhoo", destination: "Malé" },
          { id: "r10", time: "20:30", time24: "20:30", route: "THULUSDHOO_TO_MALE", departure: "Thulusdhoo", destination: "Malé" },
        ],
        fridaySchedule: [
          { id: "rf1", time: "08:30", time24: "08:30", route: "MALE_TO_THULUSDHOO", departure: "Malé", destination: "Thulusdhoo" },
          { id: "rf2", time: "16:00", time24: "16:00", route: "MALE_TO_THULUSDHOO", departure: "Malé", destination: "Thulusdhoo" },
          { id: "rf3", time: "20:30", time24: "20:30", route: "MALE_TO_THULUSDHOO", departure: "Malé", destination: "Thulusdhoo" },

        ]
      },
      {
        id: "riverspeed",

          { id: "rv2", time: "12:20", time24: "12:20", route: "MALE_TO_THULUSDHOO", departure: "Malé", destination: "Thulusdhoo" },
          { id: "rv3", time: "16:20", time24: "16:20", route: "MALE_TO_THULUSDHOO", departure: "Malé", destination: "Thulusdhoo" },
          { id: "rv4", time: "20:20", time24: "20:20", route: "MALE_TO_THULUSDHOO", departure: "Malé", destination: "Thulusdhoo" },

          { id: "rv8", time: "14:30", time24: "14:30", route: "THULUSDHOO_TO_MALE", departure: "Thulusdhoo", destination: "Malé" },
          { id: "rv9", time: "18:30", time24: "18:30", route: "THULUSDHOO_TO_MALE", departure: "Thulusdhoo", destination: "Malé" },
        ],
        fridaySchedule: [
          { id: "rvf1", time: "09:30", time24: "09:30", route: "MALE_TO_THULUSDHOO", departure: "Malé", destination: "Thulusdhoo" },
          { id: "rvf2", time: "15:00", time24: "15:00", route: "MALE_TO_THULUSDHOO", departure: "Malé", destination: "Thulusdhoo" },
          { id: "rvf3", time: "21:00", time24: "21:00", route: "MALE_TO_THULUSDHOO", departure: "Malé", destination: "Thulusdhoo" },
          { id: "rvf4", time: "08:00", time24: "08:00", route: "THULUSDHOO_TO_MALE", departure: "Thulusdhoo", destination: "Malé" },
          { id: "rvf5", time: "14:00", time24: "14:00", route: "THULUSDHOO_TO_MALE", departure: "Thulusdhoo", destination: "Malé" },
        ]
      },
    ];

    // Helper: Determine Status based on current time
    const getDepartureStatus = (time24, nextFerryTracker, now) => {
      const currentMinutes = now.getHours() * 60 + now.getMinutes();
      const [hours, minutes] = time24.split(':').map(Number);
      const itemMinutes = hours * 60 + minutes;

      if (itemMinutes < currentMinutes) {
        return { 
          status: 'Departed', 
          isNext: false, 
          style: 'bg-slate-800/60 text-slate-500 border-slate-700/50' 
        };
      } else if (!nextFerryTracker.found) {
        nextFerryTracker.found = true;
        return { 
          status: 'Next Ferry', 
          isNext: true, 
          style: 'bg-emerald-500/20 text-emerald-400 border-emerald-500/50 font-bold' 
        };
      } else {
        return { 
          status: 'Upcoming', 
          isNext: false, 
          style: 'bg-blue-500/20 text-blue-400 border-blue-500/40' 
        };
      }
    };

    // =========================================================================
    // 2. MODAL COMPONENT: ScheduleModal.jsx
    // =========================================================================
    const ScheduleModal = ({ operator, isFriday, onClose }) => {
      if (!operator) return null;
      
      const [filterRoute, setFilterRoute] = React.useState('ALL');
      const rawSchedule = isFriday ? operator.fridaySchedule : operator.regularSchedule;

      const modalSchedule = React.useMemo(() => {
        if (filterRoute === 'ALL') return rawSchedule;
        return rawSchedule.filter((item) => item.route === filterRoute);
      }, [rawSchedule, filterRoute]);

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
          <div className="relative w-full max-w-md max-h-[90vh] flex flex-col bg-[#131d35] rounded-3xl border border-slate-700/60 shadow-2xl overflow-hidden text-white">
            
            {/* Header */}
            <div className="p-5 border-b border-slate-800 bg-[#0f172a] flex items-start justify-between">
              <div>
                <h2 className="text-xl font-black text-white">{operator.name}</h2>
                <p className="text-xs text-slate-400 mt-0.5">{operator.description}</p>
              </div>
              <button
                onClick={onClose}
                className="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center text-slate-400 hover:text-white transition-colors"
              >
                ✕
              </button>
            </div>

            {/* Modal Body */}
            <div className="p-5 overflow-y-auto space-y-4">
              
              {/* Fares & Booking Info */}
              <div className="grid grid-cols-2 gap-2 bg-[#0a0f1d] p-3 rounded-2xl border border-slate-800/80 text-xs">
                <div>
                  <span className="text-slate-400 block text-[10px] uppercase font-bold">One Way</span>
                  <span className="font-bold text-emerald-400 text-sm">{operator.fareOneWay}</span>
                </div>
                <div>
                  <span className="text-slate-400 block text-[10px] uppercase font-bold">Roundtrip</span>
                  <span className="font-bold text-cyan-400 text-sm">{operator.fareRoundTrip}</span>
                </div>
              </div>

              {/* Contacts / Links */}
              <div className="space-y-1.5 bg-[#0a0f1d] p-3 rounded-2xl border border-slate-800/80 text-xs">
                <div>
                  <span className="text-slate-400 font-medium">Booking Contacts: </span>
                  <span className="font-bold text-slate-200">{operator.booking.join(" / ")}</span>
                </div>
                {operator.website && (
                  <div>
                    <span className="text-slate-400 font-medium">Website: </span>
                    <a href={`https://${operator.website}`} target="_blank" rel="noreferrer" className="text-[#00a3e0] underline font-medium">
                      {operator.website}
                    </a>
                  </div>
                )}
                {operator.email && (
                  <div>
                    <span className="text-slate-400 font-medium">Email: </span>
                    <span className="text-slate-200 font-medium">{operator.email}</span>
                  </div>
                )}
              </div>

              {/* Route Filter Tabs */}
              <div className="flex gap-1 bg-[#0a0f1d] p-1 rounded-xl border border-slate-800 text-[11px] font-bold">
                <button
                  onClick={() => setFilterRoute('ALL')}
                  className={`flex-1 py-1.5 rounded-lg transition-colors ${filterRoute === 'ALL' ? 'bg-[#00a3e0] text-white' : 'text-slate-400 hover:text-white'}`}
                >
                  All Routes
                </button>
                <button
                  onClick={() => setFilterRoute('MALE_TO_THULUSDHOO')}
                  className={`flex-1 py-1.5 rounded-lg transition-colors ${filterRoute === 'MALE_TO_THULUSDHOO' ? 'bg-[#00a3e0] text-white' : 'text-slate-400 hover:text-white'}`}
                >
                  Malé → Thulus
                </button>

                  onClick={() => setFilterRoute('THULUSDHOO_TO_MALE')}

                >

                </button>
              </div>

              {/* Timetable List */}
              <div className="space-y-2">
                <div className="flex justify-between items-center text-[10px] font-bold uppercase tracking-wider text-slate-400">
                  <span>Operator Schedule</span>
                  {isFriday && <span className="text-amber-400 font-semibold">(Friday Timetable)</span>}
                </div>

                {modalSchedule && modalSchedule.length > 0 ? (
                  modalSchedule.map((item) => (
                    <div key={item.id} className="flex items-center justify-between p-3 rounded-xl bg-[#0a0f1d]/60 border border-slate-800">
                      <span className="text-sm font-bold text-white">{item.time}</span>
                      <span className="text-xs font-semibold text-slate-400">{item.departure} → {item.destination}</span>
                    </div>
                  ))
                ) : (
                  <p className="text-xs text-slate-500 py-4 text-center">No departures for this route.</p>
                )}
              </div>

            </div>

            {/* Footer */}
            <div className="p-4 bg-[#0f172a] border-t border-slate-800 text-right">
              <button
                onClick={onClose}
                className="px-5 py-2 text-xs font-bold text-white bg-[#00a3e0] rounded-xl hover:bg-[#008ec3] transition-colors"
              >
                Close
              </button>
            </div>

          </div>
        </div>
      );
    };

    // =========================================================================
    // 3. MAIN APP COMPONENT: App.jsx
    // =========================================================================
    function App() {
      const [selectedOperator, setSelectedOperator] = React.useState(null);
      const [activeRoute, setActiveRoute] = React.useState('MALE_TO_THULUSDHOO');
      const [now, setNow] = React.useState(new Date());

      // Live Timer (1-second tick for real-time countdown)
      React.useEffect(() => {
        const timer = setInterval(() => setNow(new Date()), 1000);
        return () => clearInterval(timer);
      }, []);

      // Friday Schedule Logic
      const isFriday = now.getDay() === 5;

      const formattedDateStr = now.toLocaleDateString('en-US', {
        weekday: 'short',
        month: 'short',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: false
      });

      // Assemble full daily schedule
      const fullDailySchedule = React.useMemo(() => {
        let trips = [];
        FERRY_OPERATORS.forEach((operator) => {
          const scheduleList = isFriday ? operator.fridaySchedule : operator.regularSchedule;
          scheduleList.forEach((trip) => {
            trips.push({
              ...trip,
              operatorName: operator.name,
            });
          });
        });

        const filtered = trips.filter((t) => t.route === activeRoute);
        return filtered.sort((a, b) => a.time24.localeCompare(b.time24));
      }, [activeRoute, isFriday]);

      // Calculate status for each trip
      const nextFerryTracker = { found: false };
      const processedSchedule = fullDailySchedule.map((item) => {
        const { status, isNext, style } = getDepartureStatus(item.time24, nextFerryTracker, now);
        return { ...item, status, isNext, style };
      });

      // Next Available Ferry details
      const nextAvailableFerry = processedSchedule.find((item) => item.isNext);

      // Real-time Countdown calculation
      const countdownString = React.useMemo(() => {
        if (!nextAvailableFerry) return null;
        const [hours, minutes] = nextAvailableFerry.time24.split(':').map(Number);
        const target = new Date(now);
        target.setHours(hours, minutes, 0, 0);

        const diffMs = target - now;
        if (diffMs <= 0) return "Departing Now";

        const diffMins = Math.floor(diffMs / 60000);
        const hrs = Math.floor(diffMins / 60);
        const mins = diffMins % 60;
        const secs = Math.floor((diffMs % 60000) / 1000);

        if (hrs > 0) {
          return `Departs in ${hrs}h ${mins}m ${secs}s`;
        }
        return `Departs in ${mins}m ${secs}s`;
      }, [nextAvailableFerry, now]);

      return (
        <div className="min-h-screen bg-[#0a0f1d] text-white flex justify-center p-4 sm:p-6 font-sans">
          <div className="w-full max-w-md space-y-6">
            
            {/* Header */}
            <div className="text-center space-y-1">
              <h1 className="text-2xl font-extrabold tracking-tight">Thulusdhoo Ferry Finder</h1>
              <p className="text-xs text-slate-400 font-medium">
                {formattedDateStr} {isFriday && <span className="text-amber-400 font-bold ml-1">• Friday Timetable</span>}
              </p>
            </div>

            {/* Direction Tabs */}
            <div className="bg-[#121a2d] p-1.5 rounded-2xl border border-slate-800/80 flex gap-2">
              <button
                onClick={() => setActiveRoute('MALE_TO_THULUSDHOO')}
                className={`flex-1 py-3 text-xs font-bold rounded-xl transition-all ${
                  activeRoute === 'MALE_TO_THULUSDHOO'
                    ? 'bg-[#00a3e0] text-white shadow-lg shadow-cyan-500/20'
                    : 'text-slate-400 hover:text-white'
                }`}
              >
                Malé → Thulusdhoo
              </button>
              <button
                onClick={() => setActiveRoute('THULUSDHOO_TO_MALE')}
                className={`flex-1 py-3 text-xs font-bold rounded-xl transition-all ${
                  activeRoute === 'THULUSDHOO_TO_MALE'
                    ? 'bg-[#00a3e0] text-white shadow-lg shadow-cyan-500/20'
                    : 'text-slate-400 hover:text-white'
                }`}
              >
                Thulusdhoo → Malé
              </button>
            </div>

            {/* Next Available Ferry Card */}
            <div className="relative overflow-hidden bg-gradient-to-b from-[#131d35] to-[#0f172a] p-6 rounded-3xl border border-slate-700/50 shadow-2xl text-center space-y-3">
              <div className="inline-block px-3 py-1 rounded-full bg-[#00a3e0]/10 border border-[#00a3e0]/30 text-[#00a3e0] text-[10px] font-bold tracking-widest uppercase">
                Next Available Ferry
              </div>
              <div>
                <h3 className="text-[#00a3e0] font-semibold text-lg">
                  {nextAvailableFerry ? nextAvailableFerry.operatorName : "No More Ferries Today"}
                </h3>
                <div className="text-5xl font-black tracking-tight text-white my-1">
                  {nextAvailableFerry ? nextAvailableFerry.time : "--:--"}
                </div>
              </div>
              <div className="inline-flex items-center px-4 py-1.5 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs font-semibold">
                {countdownString || "Service Complete for Today"}
              </div>
            </div>

            {/* Operator Badges */}
            <div className="space-y-3">
              <div className="flex items-center justify-between text-xs font-bold tracking-wider text-slate-400 uppercase">
                <span>Ferry Operators</span>
                <span className="text-[10px] text-slate-500 font-normal">Tap for details & fares</span>
              </div>

              <div className="grid grid-cols-3 gap-3">
                {FERRY_OPERATORS.map((operator) => (
                  <button
                    key={operator.id}
                    onClick={() => setSelectedOperator(operator)}
                    className="p-3 bg-[#131d35] hover:bg-[#1a2744] active:scale-95 border border-slate-800 hover:border-[#00a3e0]/60 rounded-2xl transition-all text-center group flex flex-col items-center justify-center gap-1.5 shadow-md"
                  >
                    <span className="text-xs font-bold text-slate-200 group-hover:text-[#00a3e0] transition-colors truncate w-full">
                      {operator.name}
                    </span>
                    <span className="text-[10px] text-slate-400 bg-slate-800/80 px-2 py-0.5 rounded-full border border-slate-700/50">
                      {operator.fareOneWay}
                    </span>
                  </button>
                ))}
              </div>
            </div>

            {/* FULL DAILY SCHEDULE LIST */}
            <div className="space-y-3">
              <div className="flex items-center justify-between text-xs font-bold tracking-wider text-slate-400 uppercase">
                <span>Today's Full Schedule</span>
                <span className="text-[10px] text-[#00a3e0] font-medium">
                  {activeRoute === 'MALE_TO_THULUSDHOO' ? 'Malé → Thulusdhoo' : 'Thulusdhoo → Malé'}
                </span>
              </div>

              <div className="space-y-2.5">
                {processedSchedule.length > 0 ? (
                  processedSchedule.map((item) => (
                    <div
                      key={item.id}
                      className={`flex items-center justify-between p-4 border rounded-2xl transition-all ${
                        item.status === 'Departed'
                          ? 'bg-[#131d35]/30 border-slate-800/40 opacity-50'
                          : item.isNext
                          ? 'bg-[#131d35] border-[#00a3e0] shadow-lg shadow-cyan-500/10 scale-[1.01]'
                          : 'bg-[#131d35] border-slate-800/80'
                      }`}
                    >
                      <div>
                        <div className="flex items-center gap-2">
                          <span className={`text-base font-bold ${item.status === 'Departed' ? 'text-slate-400' : 'text-white'}`}>
                            {item.time}
                          </span>
                        </div>
                        <div className="text-xs text-slate-400 flex items-center gap-1.5 mt-0.5">
                          <span className="font-medium text-slate-300">{item.operatorName}</span>
                          <span className="text-slate-600">•</span>
                          <span>{item.departure} → {item.destination}</span>
                        </div>
                      </div>

                      <span className={`px-3 py-1 text-[11px] font-semibold rounded-lg border ${item.style}`}>
                        {item.status}
                      </span>
                    </div>
                  ))
                ) : (
                  <div className="p-8 text-center bg-[#131d35]/40 rounded-2xl border border-slate-800">
                    <p className="text-xs text-slate-400">No ferries scheduled for this direction today.</p>
                  </div>
                )}
              </div>
            </div>

            {/* Operator Modal */}
            <ScheduleModal
              operator={selectedOperator}
              isFriday={isFriday}
              onClose={() => setSelectedOperator(null)}
            />

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
