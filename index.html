<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ferry Operator Schedules</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & React DOM CDNs -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel CDN for inline JSX execution -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    // ==========================================
    // 1. DATA LAYER (ferrySchedules.js equivalent)
    // ==========================================
    const FERRY_OPERATORS = [
      {
        id: "refcool",
        name: "Refcool",
        description: "Daily scheduled passenger ferry service.",
        schedule: [
          { id: "r1", time: "06:30 AM", departure: "Male'", destination: "Thulusdhoo", duration: "45 mins", status: "Departed" },
          { id: "r2", time: "08:30 AM", departure: "Thulusdhoo", destination: "Male'", duration: "45 mins", status: "Departed" },
          { id: "r3", time: "11:30 AM", departure: "Male'", destination: "Thulusdhoo", duration: "45 mins", status: "Next Ferry" },
          { id: "r4", time: "02:30 PM", departure: "Thulusdhoo", destination: "Male'", duration: "45 mins", status: "Upcoming" },
          { id: "r5", time: "04:30 PM", departure: "Male'", destination: "Thulusdhoo", duration: "45 mins", status: "Upcoming" },
          { id: "r6", time: "07:30 PM", departure: "Thulusdhoo", destination: "Male'", duration: "45 mins", status: "Upcoming" },
        ],
      },
      {
        id: "tharika",
        name: "Tharika Express",
        description: "Fast transfers and regular island routes.",
        schedule: [
          { id: "t1", time: "07:00 AM", departure: "Male'", destination: "Thulusdhoo", duration: "50 mins", status: "Departed" },
          { id: "t2", time: "09:30 AM", departure: "Thulusdhoo", destination: "Male'", duration: "50 mins", status: "Departed" },
          { id: "t3", time: "01:00 PM", departure: "Male'", destination: "Thulusdhoo", duration: "50 mins", status: "Next Ferry" },
          { id: "t4", time: "04:00 PM", departure: "Thulusdhoo", destination: "Male'", duration: "50 mins", status: "Upcoming" },
          { id: "t5", time: "06:30 PM", departure: "Male'", destination: "Thulusdhoo", duration: "50 mins", status: "Upcoming" },
        ],
      },
      {
        id: "riverspeed",
        name: "Riverspeed",
        description: "Speedboat express services across the atoll.",
        schedule: [
          { id: "rv1", time: "08:00 AM", departure: "Male'", destination: "Thulusdhoo", duration: "35 mins", status: "Departed" },
          { id: "rv2", time: "10:00 AM", departure: "Thulusdhoo", destination: "Male'", duration: "35 mins", status: "Departed" },
          { id: "rv3", time: "02:00 PM", departure: "Male'", destination: "Thulusdhoo", duration: "35 mins", status: "Next Ferry" },
          { id: "rv4", time: "05:00 PM", departure: "Male'", destination: "Thulusdhoo", duration: "35 mins", status: "Upcoming" },
          { id: "rv5", time: "09:00 PM", departure: "Male'", destination: "Thulusdhoo", duration: "35 mins", status: "Upcoming" },
        ],
      },
    ];

    // Helper for Status Badge styling
    const getStatusBadge = (status) => {
      switch (status) {
        case 'Next Ferry':
          return 'bg-emerald-100 text-emerald-800 border-emerald-300 font-semibold animate-pulse';
        case 'Upcoming':
          return 'bg-blue-50 text-blue-700 border-blue-200';
        case 'Departed':
          return 'bg-gray-100 text-gray-500 border-gray-200';
        default:
          return 'bg-gray-100 text-gray-700';
      }
    };

    // ==========================================
    // 2. MODAL COMPONENT (ScheduleModal.jsx)
    // ==========================================
    const ScheduleModal = ({ operator, onClose }) => {
      if (!operator) return null;

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
          <div className="relative w-full max-w-2xl max-h-[90vh] flex flex-col bg-white rounded-2xl shadow-2xl overflow-hidden">
            
            {/* Modal Header */}
            <div className="p-5 border-b border-gray-100 flex items-center justify-between bg-slate-900 text-white">
              <div>
                <h2 className="text-xl font-bold">{operator.name}</h2>
                <p className="text-xs text-slate-300 mt-0.5">{operator.description}</p>
              </div>
              <button
                onClick={onClose}
                className="p-2 rounded-full hover:bg-slate-800 text-slate-400 hover:text-white transition-colors"
                aria-label="Close modal"
              >
                ✕
              </button>
            </div>

            {/* Timetable Body */}
            <div className="p-4 sm:p-6 overflow-y-auto space-y-3">
              <div className="flex items-center justify-between pb-2">
                <h3 className="text-sm font-semibold uppercase tracking-wider text-gray-500">
                  Today's Schedule
                </h3>
                <span className="text-xs text-gray-400">Live Status</span>
              </div>

              {/* Schedule List */}
              <div className="space-y-3">
                {operator.schedule.map((item) => (
                  <div
                    key={item.id}
                    className="flex flex-col sm:flex-row sm:items-center justify-between p-4 rounded-xl border border-gray-100 bg-gray-50/50 hover:bg-white hover:border-blue-200 hover:shadow-sm transition-all gap-3"
                  >
                    <div className="flex items-start sm:items-center gap-4">
                      <span className="text-lg font-bold text-gray-900 min-w-[85px]">
                        {item.time}
                      </span>
                      
                      <div className="flex flex-col">
                        <div className="flex items-center text-sm font-semibold text-gray-800 gap-1.5">
                          <span>{item.departure}</span>
                          <span className="text-gray-400">→</span>
                          <span>{item.destination}</span>
                        </div>
                        {item.duration && (
                          <span className="text-xs text-gray-500 mt-0.5">
                            Duration: {item.duration}
                          </span>
                        )}
                      </div>
                    </div>

                    <div className="self-end sm:self-center">
                      <span className={`px-3 py-1 text-xs rounded-full border ${getStatusBadge(item.status)}`}>
                        {item.status}
                      </span>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            {/* Modal Footer */}
            <div className="p-4 bg-gray-50 border-t border-gray-100 text-right">
              <button
                onClick={onClose}
                className="px-5 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg shadow-sm hover:bg-gray-50 transition-colors"
              >
                Close
              </button>
            </div>

          </div>
        </div>
      );
    };

    // ==========================================
    // 3. MAIN APP COMPONENT (App.jsx)
    // ==========================================
    function App() {
      const [selectedOperator, setSelectedOperator] = React.useState(null);

      return (
        <div className="min-h-screen bg-slate-50 py-10 px-4 sm:px-6">
          <div className="max-w-4xl mx-auto space-y-8">
            
            <div className="text-center space-y-2">
              <h1 className="text-3xl font-extrabold text-slate-900 sm:text-4xl">
                Ferry Operator Schedules
              </h1>
              <p className="text-slate-600">
                Select an operator below to view full daily departure timetables.
              </p>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
              {FERRY_OPERATORS.map((operator) => (
                <button
                  key={operator.id}
                  onClick={() => setSelectedOperator(operator)}
                  className="group flex flex-col justify-between p-6 bg-white rounded-2xl border border-slate-200/80 shadow-sm hover:shadow-md hover:border-blue-500 transition-all text-left focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
                >
                  <div>
                    <div className="flex items-center justify-between mb-3">
                      <h2 className="text-xl font-bold text-slate-800 group-hover:text-blue-600 transition-colors">
                        {operator.name}
                      </h2>
                      <span className="text-slate-400 group-hover:translate-x-1 transition-transform">
                        →
                      </span>
                    </div>
                    <p className="text-sm text-slate-500 leading-relaxed">
                      {operator.description}
                    </p>
                  </div>

                  <div className="mt-6 text-xs font-semibold text-blue-600 flex items-center gap-1">
                    View Today's Timetable
                  </div>
                </button>
              ))}
            </div>

            <ScheduleModal
              operator={selectedOperator}
              onClose={() => setSelectedOperator(null)}
            />

          </div>
        </div>
      );
    }

    // Render the App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
