<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thulusdhoo Ferry Transport V2</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel Compiler -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- External Schedules Data File -->
  <script src="./schedulesData.js"></script>

  <style>
    @keyframes rain {
      0% { transform: translateY(-100%) translateX(0); opacity: 0; }
      50% { opacity: 0.6; }
      100% { transform: translateY(200%) translateX(-20px); opacity: 0; }
    }
    @keyframes cloudDrift {
      0% { transform: translateX(-20%); }
      50% { transform: translateX(20%); }
      100% { transform: translateX(-20%); }
    }
    @keyframes sunGlow {
      0%, 100% { opacity: 0.2; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.1); }
    }
    .animate-rain { animation: rain 1.2s linear infinite; }
    .animate-cloud { animation: cloudDrift 16s ease-in-out infinite; }
    .animate-sun { animation: sunGlow 4s ease-in-out infinite; }

    .fade-to-top-mask {
      mask-image: linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,0.8) 50%, rgba(0,0,0,0) 100%);
      -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,0.8) 50%, rgba(0,0,0,0) 100%);
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#f3f4f6] text-slate-800 min-h-screen">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback } = React;

    const decodeWeatherCode = (code) => {
      switch (code) {
        case 0: return { condition: 'Sunny', isBadWeather: false, type: 'sunny' };
        case 1:
        case 2:
        case 3: return { condition: 'Partly Cloudy', isBadWeather: false, type: 'cloudy' };
        case 45:
        case 48: return { condition: 'Foggy', isBadWeather: false, type: 'cloudy' };
        case 51:
        case 53:
        case 55: return { condition: 'Drizzle', isBadWeather: true, type: 'rain' };
        case 61:
        case 63:
        case 65: return { condition: 'Rain', isBadWeather: true, type: 'rain' };
        case 80:
        case 81:
        case 82: return { condition: 'Showers', isBadWeather: true, type: 'rain' };
        case 95:
        case 96:
        case 99: return { condition: 'Thunderstorm', isBadWeather: true, type: 'rain' };
        default: return { condition: 'Cloudy', isBadWeather: false, type: 'cloudy' };
      }
    };

    function WeatherBackground({ weatherType }) {
      if (weatherType === 'rain') {
        return (
          <div className="absolute inset-0 pointer-events-none overflow-hidden opacity-30 z-10">
            {[...Array(12)].map((_, i) => (
              <div
                key={i}
                className="absolute bg-sky-300 w-[1px] h-6 rounded-full animate-rain"
                style={{
                  left: `${(i * 8.5) + 2}%`,
                  top: `-${Math.random() * 20}%`,
                  animationDuration: `${0.8 + Math.random() * 0.6}s`,
                  animationDelay: `${Math.random() * 1.5}s`
                }}
              ></div>
            ))}
          </div>
        );
      }

      if (weatherType === 'sunny') {
        return (
          <div className="absolute inset-0 pointer-events-none overflow-hidden z-10">
            <div className="absolute -top-12 -right-12 w-40 h-40 bg-amber-400/20 rounded-full blur-2xl animate-sun"></div>
            <div className="absolute top-1/2 left-1/4 w-20 h-20 bg-sky-400/10 rounded-full blur-xl animate-sun" style={{ animationDelay: '2s' }}></div>
          </div>
        );
      }

      return (
        <div className="absolute inset-0 pointer-events-none overflow-hidden opacity-25 z-10">
          <div className="absolute -top-4 -left-10 w-48 h-20 bg-slate-400/30 rounded-full blur-xl animate-cloud"></div>
          <div className="absolute bottom-0 right-0 w-56 h-24 bg-sky-500/20 rounded-full blur-2xl animate-cloud" style={{ animationDuration: '22s' }}></div>
        </div>
      );
    }

    function SupplyModal({ ferry, onClose }) {
      if (!ferry) return null;

      return (
        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 bg-black/60 backdrop-blur-sm transition-opacity">
          <div className="relative w-full max-w-md bg-white rounded-t-3xl sm:rounded-3xl shadow-2xl overflow-hidden text-slate-800 border border-slate-100 max-h-[85vh] flex flex-col">
            <div className="p-5 border-b border-slate-100 bg-amber-50/50 flex items-start justify-between">
              <div>
                <span className="text-[10px] uppercase font-bold tracking-wider text-amber-700 bg-amber-100 px-2.5 py-0.5 rounded-full">
                  {ferry.tag}
                </span>
                <h2 className="text-xl font-black text-slate-900 mt-1">{ferry.name}</h2>
                <p className="text-xs text-slate-500 mt-0.5">Regular Supply & Cargo Vessel Schedule</p>
              </div>
              <button
                onClick={onClose}
                className="w-8 h-8 rounded-full bg-slate-200/60 flex items-center justify-center text-slate-500 hover:text-slate-800 transition-colors"
              >
                ✕
              </button>
            </div>

            <div className="p-5 overflow-y-auto space-y-4">
              {ferry.liveTrackingUrl && (
                <a
                  href={ferry.liveTrackingUrl}
                  target="_blank"
                  rel="noreferrer"
                  className="flex items-center justify-between p-3.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-2xl shadow-md transition-colors"
                >
                  <div className="flex items-center gap-2.5">
                    <span className="relative flex h-3 w-3">
                      <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-300 opacity-75"></span>
                      <span className="relative inline-flex rounded-full h-3 w-3 bg-white"></span>
                    </span>
                    <div>
                      <span className="text-xs font-black uppercase tracking-wider block leading-none">Track Live Location</span>
                      <span className="text-[10px] text-emerald-100 font-medium">FollowMe.mv Marine GPS</span>
                    </div>
                  </div>
                  <span className="text-xs font-bold bg-white/20 px-2.5 py-1 rounded-lg">View ↗</span>
                </a>
              )}

              <div>
                <span className="text-slate-400 block text-[10px] uppercase font-bold mb-2">Operating Days</span>
                <div className="flex flex-wrap gap-1.5">
                  {["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"].map((day) => {
                    const isActive = ferry.days?.includes(day);
                    return (
                      <span
                        key={day}
                        className={`text-xs px-2.5 py-1 rounded-lg font-bold border ${
                          isActive
                            ? 'bg-amber-500 text-white border-amber-500 shadow-sm'
                            : 'bg-slate-50 text-slate-300 border-slate-100 line-through'
                        }`}
                      >
                        {day.slice(0, 3)}
                      </span>
                    );
                  })}
                </div>
              </div>

              <div className="space-y-2">
                <span className="text-slate-400 block text-[10px] uppercase font-bold">Departure Times</span>
                <div className="flex items-center justify-between p-3.5 rounded-2xl bg-slate-50 border border-slate-100">
                  <div>
                    <span className="text-[10px] font-bold uppercase tracking-wider text-slate-400">From Thulusdhoo</span>
                    <p className="text-xs font-semibold text-slate-600">Morning Departure</p>
                  </div>
                  <span className="text-base font-black text-slate-900 font-mono">{ferry.thulusdhooTime}</span>
                </div>

                <div className="flex items-center justify-between p-3.5 rounded-2xl bg-slate-50 border border-slate-100">
                  <div>
                    <span className="text-[10px] font-bold uppercase tracking-wider text-slate-400">From Malé</span>
                    <p className="text-xs font-semibold text-slate-600">Afternoon Return</p>
                  </div>
                  <span className="text-base font-black text-slate-900 font-mono">{ferry.maleTime}</span>
                </div>
              </div>

              <div className="space-y-2 bg-slate-50 p-3.5 rounded-2xl border border-slate-100 text-xs">
                <span className="text-slate-400 block text-[10px] uppercase font-bold mb-1">Contact Numbers</span>
                <div className="flex flex-wrap gap-2">
                  {ferry.contacts?.map((phone, i) => (
                    <a key={i} href={`tel:${phone}`} className="font-bold text-slate-800 bg-white px-3 py-1.5 rounded-xl border border-slate-200 hover:border-amber-500 transition-colors shadow-sm">
                      📞 {phone}
                    </a>
                  ))}
                </div>
              </div>
            </div>

            <div className="p-4 bg-slate-50 border-t border-slate-100 text-right">
              <button
                onClick={onClose}
                className="w-full py-2.5 text-xs font-bold text-white bg-slate-900 rounded-xl hover:bg-slate-800 transition-colors shadow-sm"
              >
                Close
              </button>
            </div>
          </div>
        </div>
      );
    }

    function ScheduleModal({ operator, isFriday, onClose }) {
      if (!operator) return null;
      const [filterRoute, setFilterRoute] = useState('ALL');
      const rawSchedule = isFriday ? (operator.fridaySchedule || []) : (operator.regularSchedule || []);
      const activeVessel = operator.vessels?.find(v => v.isActive) || operator.vessels?.[0];

      const modalSchedule = useMemo(() => {
        if (filterRoute === 'ALL') return rawSchedule;
        return rawSchedule.filter((item) => item.route === filterRoute);
      }, [rawSchedule, filterRoute]);

      return (
        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 bg-black/60 backdrop-blur-sm transition-opacity">
          <div className="relative w-full max-w-md bg-white rounded-t-3xl sm:rounded-3xl shadow-2xl overflow-hidden text-slate-800 border border-slate-100 max-h-[85vh] flex flex-col">
            <div className="p-5 border-b border-slate-100 bg-slate-50 flex items-start justify-between">
              <div>
                <span className="text-[10px] uppercase font-bold tracking-wider text-sky-600 bg-sky-100 px-2.5 py-0.5 rounded-full">
                  {operator.tag}
                </span>
                <h2 className="text-xl font-black text-slate-900 mt-1">{operator.name}</h2>
                <p className="text-xs text-slate-500 mt-0.5">{operator.description}</p>
              </div>
              <button
                onClick={onClose}
                className="w-8 h-8 rounded-full bg-slate-200/60 flex items-center justify-center text-slate-500 hover:text-slate-800 transition-colors"
              >
                ✕
              </button>
            </div>

            <div className="p-5 overflow-y-auto space-y-4">
              {activeVessel && (
                <a
                  href={activeVessel.trackingUrl}
                  target="_blank"
                  rel="noreferrer"
                  className="flex items-center justify-between p-3.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-2xl shadow-md transition-colors"
                >
                  <div className="flex items-center gap-2.5">
                    <span className="relative flex h-3 w-3">
                      <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-300 opacity-75"></span>
                      <span className="relative inline-flex rounded-full h-3 w-3 bg-white"></span>
                    </span>
                    <div>
                      <span className="text-xs font-black uppercase tracking-wider block leading-none">
                        🟢 {activeVessel.name} • Live Location
                      </span>
                      <span className="text-[10px] text-emerald-100 font-medium">FollowMe.mv Marine GPS</span>
                    </div>
                  </div>
                  <span className="text-xs font-bold bg-white/20 px-2.5 py-1 rounded-lg">View ↗</span>
                </a>
              )}

              <div className="grid grid-cols-2 gap-3">
                <div className="bg-slate-50 p-3 rounded-2xl border border-slate-100">
                  <span className="text-slate-400 block text-[10px] uppercase font-bold">One Way</span>
                  <span className="font-extrabold text-emerald-600 text-base">{operator.fareOneWay}</span>
                </div>
                <div className="bg-slate-50 p-3 rounded-2xl border border-slate-100">
                  <span className="text-slate-400 block text-[10px] uppercase font-bold">Roundtrip</span>
                  <span className="font-extrabold text-sky-600 text-base">{operator.fareRoundTrip}</span>
                </div>
              </div>

              <div className="space-y-2 bg-slate-50 p-3.5 rounded-2xl border border-slate-100 text-xs">
                <div>
                  <span className="text-slate-400 block text-[10px] uppercase font-bold mb-1">Hotline Contacts</span>
                  <div className="flex gap-2">
                    {operator.booking?.map((phone, i) => (
                      <a key={i} href={`tel:${phone}`} className="font-bold text-slate-800 bg-white px-3 py-1 rounded-lg border border-slate-200 hover:border-sky-500 transition-colors">
                        {phone}
                      </a>
                    ))}
                  </div>
                </div>
                {operator.website && (
                  <div className="pt-1">
                    <span className="text-slate-400 font-medium">Website: </span>
                    <a href={`https://${operator.website}`} target="_blank" rel="noreferrer" className="text-sky-600 font-bold underline">
                      {operator.website}
                    </a>
                  </div>
                )}
              </div>

              <div className="flex gap-1 bg-slate-100 p-1 rounded-xl text-[11px] font-bold">
                <button
                  onClick={() => setFilterRoute('ALL')}
                  className={`flex-1 py-1.5 rounded-lg transition-all ${filterRoute === 'ALL' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-800'}`}
                >
                  All Routes
                </button>
                <button
                  onClick={() => setFilterRoute('MALE_TO_THULUSDHOO')}
                  className={`flex-1 py-1.5 rounded-lg transition-all ${filterRoute === 'MALE_TO_THULUSDHOO' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-800'}`}
                >
                  Malé → Thulus
                </button>
                <button
                  onClick={() => setFilterRoute('THULUSDHOO_TO_MALE')}
                  className={`flex-1 py-1.5 rounded-lg transition-all ${filterRoute === 'THULUSDHOO_TO_MALE' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-800'}`}
                >
                  Thulus → Malé
                </button>
              </div>

              <div className="space-y-2">
                <div className="flex justify-between items-center text-[10px] font-bold uppercase tracking-wider text-slate-400">
                  <span>Timetable</span>
                  {isFriday && <span className="text-amber-600 font-semibold">(Friday Schedule)</span>}
                </div>

                {modalSchedule && modalSchedule.length > 0 ? (
                  modalSchedule.map((item) => (
                    <div key={item.id} className="flex items-center justify-between p-3 rounded-xl bg-slate-50 border border-slate-100">
                      <span className="text-sm font-extrabold text-slate-800">{item.time}</span>
                      <span className="text-xs font-semibold text-slate-500">{item.departure} → {item.destination}</span>
                    </div>
                  ))
                ) : (
                  <p className="text-xs text-slate-400 py-4 text-center">No departures scheduled for this route.</p>
                )}
              </div>
            </div>

            <div className="p-4 bg-slate-50 border-t border-slate-100 text-right">
              <button
                onClick={onClose}
                className="w-full py-2.5 text-xs font-bold text-white bg-slate-900 rounded-xl hover:bg-slate-800 transition-colors shadow-sm"
              >
                Done
              </button>
            </div>
          </div>
        </div>
      );
    }

    function App() {
      // Direct load from window object with fallback
      const getInitialOperators = () => window.INITIAL_FERRY_OPERATORS || [];
      const getInitialSupply = () => window.SUPPLY_FERRIES || [];

      const [operators, setOperators] = useState(getInitialOperators);
      const [supplyFerries, setSupplyFerries] = useState(getInitialSupply);
      const [selectedOperator, setSelectedOperator] = useState(null);
      const [selectedSupplyFerry, setSelectedSupplyFerry] = useState(null);
      const [activeRoute, setActiveRoute] = useState('MALE_TO_THULUSDHOO');
      const [now, setNow] = useState(new Date());

      const [weather, setWeather] = useState({
        temp: '28',
        condition: 'Partly Cloudy',
        isBadWeather: false,
        type: 'cloudy'
      });

      // Sync window data if script loaded slightly after initial render
      useEffect(() => {
        if (operators.length === 0 && window.INITIAL_FERRY_OPERATORS) {
          setOperators(window.INITIAL_FERRY_OPERATORS);
        }
        if (supplyFerries.length === 0 && window.SUPPLY_FERRIES) {
          setSupplyFerries(window.SUPPLY_FERRIES);
        }
      }, []);

      useEffect(() => {
        const timer = setInterval(() => setNow(new Date()), 1000);
        return () => clearInterval(timer);
      }, []);

      useEffect(() => {
        const fetchWeather = async () => {
          try {
            const response = await fetch(
              'https://api.open-meteo.com/v1/forecast?latitude=4.373&longitude=73.651&current=temperature_2m,weather_code,wind_speed_10m'
            );
            const data = await response.json();
            if (data && data.current) {
              const temp = Math.round(data.current.temperature_2m);
              const { condition, isBadWeather, type } = decodeWeatherCode(data.current.weather_code);
              setWeather({ temp: `${temp}`, condition, isBadWeather, type });
            }
          } catch (error) {
            console.error('Weather fetch error:', error);
          }
        };

        fetchWeather();
        const weatherTimer = setInterval(fetchWeather, 15 * 60 * 1000);
        return () => clearInterval(weatherTimer);
      }, []);

      const isFridayToday = now.getDay() === 5;
      const isFridayTomorrow = ((now.getDay() + 1) % 7) === 5;

      const formattedClock = now.toLocaleTimeString('en-US', {
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
      });

      const formattedDate = now.toLocaleDateString('en-US', {
        weekday: 'short',
        month: 'short',
        day: 'numeric'
      });

      const buildScheduleForDay = useCallback((isFriday, isTomorrow = false) => {
        let trips = [];
        operators.forEach((operator) => {
          const scheduleList = isFriday ? (operator.fridaySchedule || []) : (operator.regularSchedule || []);
          scheduleList.forEach((trip) => {
            trips.push({
              ...trip,
              id: isTomorrow ? `tomorrow-${trip.id}` : trip.id,
              operatorName: operator.name,
              operatorId: operator.id,
              isTomorrow
            });
          });
        });

        const filtered = trips.filter((t) => t.route === activeRoute);
        return filtered.sort((a, b) => (a.time24 || '').localeCompare(b.time24 || ''));
      }, [operators, activeRoute]);

      const todaysDailySchedule = useMemo(() => buildScheduleForDay(isFridayToday, false), [buildScheduleForDay, isFridayToday]);
      const tomorrowsDailySchedule = useMemo(() => buildScheduleForDay(isFridayTomorrow, true), [buildScheduleForDay, isFridayTomorrow]);

      const processedTodaySchedule = useMemo(() => {
        const currentMinutes = now.getHours() * 60 + now.getMinutes();

        return todaysDailySchedule.map((item) => {
          const [hours, minutes] = (item.time24 || '00:00').split(':').map(Number);
          const itemMinutes = hours * 60 + minutes;

          if (itemMinutes < currentMinutes) {
            return { ...item, status: 'Departed', isNext: false, style: 'bg-slate-100 text-slate-400 border-slate-200' };
          }
          return { ...item, status: 'Upcoming', isNext: false, style: 'bg-sky-50 text-sky-600 border-sky-200' };
        });
      }, [todaysDailySchedule, now]);

      const hasUpcomingToday = processedTodaySchedule.some((item) => item.status !== "Departed");

      const displaySchedule = useMemo(() => {
        if (hasUpcomingToday) {
          const nextAvailable = processedTodaySchedule.find((item) => item.status !== "Departed");
          const nextTime = nextAvailable?.time24;

          return processedTodaySchedule.map((item) => {
            if (item.status === 'Departed') return item;
            const isNext = item.time24 === nextTime;
            return {
              ...item,
              isNext,
              status: isNext ? 'Next Ferry' : 'Upcoming',
              style: isNext
                ? 'bg-emerald-500/10 text-emerald-600 border-emerald-500/30 font-bold'
                : 'bg-sky-50 text-sky-600 border-sky-200'
            };
          });
        }

        const earliestTomorrowTime = tomorrowsDailySchedule[0]?.time24;

        const processedTomorrow = tomorrowsDailySchedule.map((item) => {
          const isNext = item.time24 === earliestTomorrowTime;
          return {
            ...item,
            status: 'Tomorrow',
            isNext,
            style: isNext
              ? 'bg-emerald-500/10 text-emerald-600 border-emerald-500/30 font-bold'
              : 'bg-slate-100 text-slate-600 border-slate-200'
          };
        });

        return [
          ...processedTodaySchedule,
          { id: 'tomorrow-header', type: 'header', title: 'Tomorrow' },
          ...processedTomorrow
        ];
      }, [hasUpcomingToday, processedTodaySchedule, tomorrowsDailySchedule]);

      const nextAvailableFerry = useMemo(() => {
        return displaySchedule.find((item) => item.isNext);
      }, [displaySchedule]);

      return (
        <div className="min-h-screen flex justify-center py-0 sm:py-6 px-0 sm:px-4">
          <div className="relative w-full max-w-md bg-white/90 sm:rounded-3xl shadow-xl overflow-hidden flex flex-col min-h-screen sm:min-h-0 backdrop-blur-sm z-0">
            
            <div 
              className="relative text-white p-6 overflow-hidden bg-cover bg-center z-10"
              style={{ backgroundImage: "url('https://raw.githubusercontent.com/feyzhub/FerryNow-Thulusdhoo/main/V1.png')" }}
            >
              <div className="absolute inset-0 bg-gradient-to-b from-slate-950/80 via-slate-900/70 to-slate-950/85 pointer-events-none"></div>

              <WeatherBackground weatherType={weather.type} />

              <div className="relative z-20 flex items-start justify-between drop-shadow-md">
                <div>
                  <span className="text-[10px] font-bold uppercase tracking-widest text-sky-300 bg-slate-900/80 border border-sky-500/30 px-2.5 py-1 rounded-full inline-block mb-1 shadow-sm backdrop-blur-md">
                    Maldives Atoll Transit
                  </span>
                  <h1 className="text-2xl font-black tracking-tight drop-shadow-lg">Thulusdhoo Express</h1>
                </div>
                <div className="text-right drop-shadow-lg">
                  <div className="text-2xl font-black font-mono tracking-tight">{formattedClock}</div>
                  <div className="text-[10px] font-semibold text-slate-300 uppercase tracking-wider">{formattedDate}</div>
                </div>
              </div>

              <div className="relative z-20 mt-4 flex items-center justify-between pt-3 border-t border-white/10 text-xs text-slate-200 drop-shadow-sm">
                <div className="flex items-center gap-2">
                  <span className="text-base font-bold text-white">{weather.temp}°C</span>
                  <span className="text-slate-400">•</span>
                  <span className="font-medium text-slate-100">{weather.condition}</span>
                </div>
                {weather.isBadWeather && (
                  <span className="text-[10px] font-extrabold text-amber-300 bg-amber-950/90 border border-amber-600/60 px-2 py-0.5 rounded-full shadow-sm">
                    ⚠️ Sea Advisory
                  </span>
                )}
              </div>
            </div>

            <div className="p-4 sm:p-5 flex-1 space-y-4 relative z-10 pb-40">
              
              {operators.length > 0 && (
                <div className="bg-slate-100/90 p-1.5 rounded-2xl backdrop-blur-sm border border-slate-200/60">
                  <div className="flex items-center justify-between gap-1 overflow-x-auto no-scrollbar">
                    {operators.map((op) => (
                      <button
                        key={op.id}
                        onClick={() => setSelectedOperator(op)}
                        className="flex-1 min-w-fit px-2.5 py-1.5 bg-white hover:bg-slate-50 border border-slate-200/80 rounded-xl flex items-center justify-center gap-1.5 shadow-sm transition-all text-xs font-bold text-slate-800"
                      >
                        <span className={`w-2 h-2 rounded-full ${op.dotColor || 'bg-sky-500'} shrink-0`}></span>
                        <span className="truncate whitespace-nowrap text-[11px]">{op.shortName || op.name}</span>
                      </button>
                    ))}
                  </div>
                </div>
              )}

              <div className="grid grid-cols-2 gap-1.5 p-1 bg-slate-100/80 rounded-2xl backdrop-blur-sm">
                <button
                  onClick={() => setActiveRoute('MALE_TO_THULUSDHOO')}
                  className={`py-2.5 px-3 rounded-xl text-xs font-bold transition-all ${
                    activeRoute === 'MALE_TO_THULUSDHOO'
                      ? 'bg-white text-slate-900 shadow-sm'
                      : 'text-slate-500 hover:text-slate-800'
                  }`}
                >
                  Malé → Thulusdhoo
                </button>
                <button
                  onClick={() => setActiveRoute('THULUSDHOO_TO_MALE')}
                  className={`py-2.5 px-3 rounded-xl text-xs font-bold transition-all ${
                    activeRoute === 'THULUSDHOO_TO_MALE'
                      ? 'bg-white text-slate-900 shadow-sm'
                      : 'text-slate-500 hover:text-slate-800'
                  }`}
                >
                  Thulusdhoo → Malé
                </button>
              </div>

              {nextAvailableFerry && (
                <div className="p-4 rounded-2xl bg-gradient-to-r from-emerald-500/10 via-emerald-500/5 to-transparent border border-emerald-500/20 flex items-center justify-between backdrop-blur-sm">
                  <div className="flex items-center gap-3">
                    <div className="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></div>
                    <div>
                      <span className="text-[10px] font-black uppercase tracking-wider text-emerald-600 block">Next Departure</span>
                      <span className="text-sm font-black text-slate-900">
                        {nextAvailableFerry.operatorName}
                        {nextAvailableFerry.isTomorrow && <span className="text-xs text-amber-600 ml-1">(Tomorrow)</span>}
                      </span>
                    </div>
                  </div>
                  <div className="text-right">
                    <span className="text-lg font-black font-mono text-emerald-600">{nextAvailableFerry.time}</span>
                  </div>
                </div>
              )}

              <div className="space-y-2">
                <div className="flex items-center justify-between px-1">
                  <span className="text-[11px] font-bold uppercase tracking-wider text-slate-400">Today's Schedule</span>
                  {isFridayToday && (
                    <span className="text-[10px] font-bold text-amber-600 bg-amber-50 px-2 py-0.5 rounded-full border border-amber-200">
                      Friday Hours
                    </span>
                  )}
                </div>

                <div className="space-y-2">
                  {displaySchedule.map((item) => {
                    if (item.type === 'header') {
                      return (
                        <div key={item.id} className="pt-3 pb-1 border-t border-slate-100 flex items-center justify-between px-1">
                          <span className="text-[11px] font-bold uppercase tracking-wider text-slate-400">{item.title}</span>
                          {isFridayTomorrow && (
                            <span className="text-[10px] font-bold text-amber-600 bg-amber-50 px-2 py-0.5 rounded-full border border-amber-200">
                              Friday Hours
                            </span>
                          )}
                        </div>
                      );
                    }

                    const operatorObj = operators.find(o => o.id === item.operatorId);

                    return (
                      <div
                        key={item.id}
                        onClick={() => setSelectedOperator(operatorObj)}
                        className={`p-3.5 rounded-2xl border transition-all cursor-pointer flex items-center justify-between hover:border-slate-300 backdrop-blur-sm ${
                          item.isNext ? 'bg-emerald-50/70 border-emerald-200 shadow-sm' : 'bg-slate-50/70 border-slate-100'
                        }`}
                      >
                        <div className="flex items-center gap-3">
                          <span className="text-base font-black font-mono text-slate-900">{item.time}</span>
                          <div>
                            <span className="text-xs font-bold text-slate-800 block">{item.operatorName}</span>
                            <span className="text-[10px] text-slate-400">{item.departure} → {item.destination}</span>
                          </div>
                        </div>

                        <div className="flex items-center gap-2">
                          <span className={`text-[10px] font-bold px-2.5 py-1 rounded-full border ${item.style}`}>
                            {item.status}
                          </span>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>

              {supplyFerries.length > 0 && (
                <div className="pt-1">
                  <span className="text-[11px] font-bold uppercase tracking-wider text-slate-400 block mb-2 px-1">Cargo & Supply Vessels</span>
                  <div className="grid grid-cols-2 gap-2">
                    {supplyFerries.map((supply) => (
                      <button
                        key={supply.id}
                        onClick={() => setSelectedSupplyFerry(supply)}
                        className="p-3 bg-amber-50/70 hover:bg-amber-100/70 border border-amber-200/60 rounded-2xl text-left transition-colors backdrop-blur-sm"
                      >
                        <span className="text-[9px] uppercase font-bold text-amber-700 bg-amber-100 px-2 py-0.5 rounded-full inline-block mb-1">
                          {supply.tag}
                        </span>
                        <span className="text-xs font-black text-slate-900 block">{supply.name}</span>
                        <span className="text-[10px] text-slate-500 font-medium block mt-0.5">Tap for details ↗</span>
                      </button>
                    ))}
                  </div>
                </div>
              )}

            </div>

            <div 
              className="absolute bottom-0 left-0 right-0 h-48 bg-cover bg-bottom bg-no-repeat pointer-events-none z-0 fade-to-top-mask opacity-80"
              style={{ backgroundImage: "url('https://raw.githubusercontent.com/feyzhub/FerryNow-Thulusdhoo/main/back_btm.png')" }}
            ></div>

            {selectedOperator && (
              <ScheduleModal
                operator={selectedOperator}
                isFriday={isFridayToday}
                onClose={() => setSelectedOperator(null)}
              />
            )}

            {selectedSupplyFerry && (
              <SupplyModal
                ferry={selectedSupplyFerry}
                onClose={() => setSelectedSupplyFerry(null)}
              />
            )}

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
