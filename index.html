  <!-- Custom CSS for Weather Animations & Fade Mask -->
  <style>
    @keyframes rain {
      0% { transform: translateY(-100%) translateX(0); opacity: 0; }
      50% { opacity: 0.6; }
      100% { transform: translateY(200%) translateX(-20px); opacity: 0; }
    }
    @keyframes cloudDrift {
      0% { transform: translateX(-20%); }
      50% { transform: translateX(20%); }
      100% { transform: translateX(-20%); }
    }
    @keyframes sunGlow {
      0%, 100% { opacity: 0.2; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.1); }
    }
    .animate-rain { animation: rain 1.2s linear infinite; }
    .animate-cloud { animation: cloudDrift 16s ease-in-out infinite; }
    .animate-sun { animation: sunGlow 4s ease-in-out infinite; }

    /* Smooth top fade for bottom image */
    .fade-to-top-mask {
      mask-image: linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,0.8) 50%, rgba(0,0,0,0) 100%);
      -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,0.8) 50%, rgba(0,0,0,0) 100%);
    }

    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    // Helper: Check FollowMe status using CORS proxy scraper
    async function checkFollowMeStatus(trackingUrl) {
      if (!trackingUrl || !trackingUrl.includes('followme.mv')) return false;
      try {
        const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(trackingUrl)}`;
        const response = await fetch(proxyUrl);
        if (!response.ok) return false;
        const data = await response.json();
        const html = data.contents || "";
        
        // Detect green indicators on FollowMe page
        const isOnline = html.includes('#00FF00') || 
                         html.includes('#00ff00') || 
                         html.toLowerCase().includes('status: online') || 
                         html.toLowerCase().includes('tracking online') || 
                         html.toLowerCase().includes('active');
        return isOnline;
      } catch (err) {
        console.warn('FollowMe proxy check failed for', trackingUrl, err);
        return false;
      }
    }

        case 51:
        case 53:
        case 55: return { condition: 'Drizzle', isBadWeather: true, type: 'rain' };
        case 61:
        case 63:
        case 65: return { condition: 'Rain', isBadWeather: true, type: 'rain' };
        case 80:
        case 81:
        case 82: return { condition: 'Showers', isBadWeather: true, type: 'rain' };
        case 95:
        case 96:
        case 99: return { condition: 'Thunderstorm', isBadWeather: true, type: 'rain' };
        default: return { condition: 'Cloudy', isBadWeather: false, type: 'cloudy' };

              </button>
            </div>

            <div className="p-5 overflow-y-auto space-y-4">
              {activeVessel && (
                <a
                  href={activeVessel.trackingUrl}
                  target="_blank"
                  rel="noreferrer"
                  className="flex items-center justify-between p-3.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-2xl shadow-md transition-colors"
                >
                  <div className="flex items-center gap-2.5">
                    <span className="relative flex h-3 w-3">
                      <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-300 opacity-75"></span>
                      <span className="relative inline-flex rounded-full h-3 w-3 bg-white"></span>
                    </span>
                    <div>
                      <span className="text-xs font-black uppercase tracking-wider block leading-none">
                        🟢 {activeVessel.name} • Live Location
                      </span>
                      <span className="text-[10px] text-emerald-100 font-medium">FollowMe.mv Marine GPS</span>
                    </div>
                  </div>
                  <span className="text-xs font-bold bg-white/20 px-2.5 py-1 rounded-lg">View ↗</span>
                </a>
              )}

              <div className="grid grid-cols-2 gap-3">
                <div className="bg-slate-50 p-3 rounded-2xl border border-slate-100">
                  <span className="text-slate-400 block text-[10px] uppercase font-bold">One Way</span>
                  <span className="font-extrabold text-emerald-600 text-base">{operator.fareOneWay}</span>
                </div>
                <div className="bg-slate-50 p-3 rounded-2xl border border-slate-100">
                  <span className="text-slate-400 block text-[10px] uppercase font-bold">Roundtrip</span>
                  <span className="font-extrabold text-sky-600 text-base">{operator.fareRoundTrip}</span>
                </div>
              </div>

              <div className="space-y-2 bg-slate-50 p-3.5 rounded-2xl border border-slate-100 text-xs">
                <div>
                  <span className="text-slate-400 block text-[10px] uppercase font-bold mb-1">Hotline Contacts</span>
                  <div className="flex gap-2">
                    {operator.booking.map((phone, i) => (
                      <a key={i} href={`tel:${phone}`} className="font-bold text-slate-800 bg-white px-3 py-1 rounded-lg border border-slate-200 hover:border-sky-500 transition-colors">
                        {phone}
                      </a>
                    ))}
                  </div>
                </div>
                {operator.website && (
                  <div className="pt-1">
                    <span className="text-slate-400 font-medium">Website: </span>
                    <a href={`https://${operator.website}`} target="_blank" rel="noreferrer" className="text-sky-600 font-bold underline">
                      {operator.website}
                    </a>
                  </div>
                )}
              </div>

              <div className="flex gap-1 bg-slate-100 p-1 rounded-xl text-[11px] font-bold">
                <button
                  onClick={() => setFilterRoute('ALL')}
                  className={`flex-1 py-1.5 rounded-lg transition-all ${filterRoute === 'ALL' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-800'}`}
                >
                  All Routes
                </button>
                <button
                  onClick={() => setFilterRoute('MALE_TO_THULUSDHOO')}
                  className={`flex-1 py-1.5 rounded-lg transition-all ${filterRoute === 'MALE_TO_THULUSDHOO' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-800'}`}
                >
                  Malé → Thulus
                </button>
                <button
                  onClick={() => setFilterRoute('THULUSDHOO_TO_MALE')}
                  className={`flex-1 py-1.5 rounded-lg transition-all ${filterRoute === 'THULUSDHOO_TO_MALE' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-800'}`}
                >
                  Thulus → Malé
                </button>
              </div>

              <div className="space-y-2">
                <div className="flex justify-between items-center text-[10px] font-bold uppercase tracking-wider text-slate-400">
                  <span>Timetable</span>
                  {isFriday && <span className="text-amber-600 font-semibold">(Friday Schedule)</span>}
                </div>

                {modalSchedule && modalSchedule.length > 0 ? (
                  modalSchedule.map((item) => (
                    <div key={item.id} className="flex items-center justify-between p-3 rounded-xl bg-slate-50 border border-slate-100">
                      <span className="text-sm font-extrabold text-slate-800">{item.time}</span>
                      <span className="text-xs font-semibold text-slate-500">{item.departure} → {item.destination}</span>
                    </div>
                  ))
                ) : (
                  <p className="text-xs text-slate-400 py-4 text-center">No departures scheduled for this route.</p>
                )}
              </div>
            </div>

            <div className="p-4 bg-slate-50 border-t border-slate-100 text-right">
              <button
                onClick={onClose}
                className="w-full py-2.5 text-xs font-bold text-white bg-slate-900 rounded-xl hover:bg-slate-800 transition-colors shadow-sm"
              >
                Done
              </button>
            </div>
          </div>
        </div>
      );
    }

    function App() {
      const [operators, setOperators] = useState(INITIAL_FERRY_OPERATORS);
      const [selectedOperator, setSelectedOperator] = useState(null);
      const [selectedSupplyFerry, setSelectedSupplyFerry] = useState(null);
      const [activeRoute, setActiveRoute] = useState('MALE_TO_THULUSDHOO');
      const [now, setNow] = useState(new Date());

      const [weather, setWeather] = useState({
        temp: '--',
        condition: 'Loading...',
        isBadWeather: false,
        type: 'cloudy'
      });

      // --- LIVE VESSEL STATUS CHECKER ---
      const refreshVesselStatuses = useCallback(async () => {
        const updatedOperators = await Promise.all(
          operators.map(async (op) => {
            if (!op.vessels || op.vessels.length === 0) return op;

            let activeFound = false;
            const updatedVessels = await Promise.all(
              op.vessels.map(async (vessel) => {
                const isOnline = await checkFollowMeStatus(vessel.trackingUrl);
                const isActive = isOnline && !activeFound;
                if (isActive) activeFound = true;
                return { ...vessel, isActive, status: isOnline ? 'online' : 'offline' };
              })
            );

            if (!activeFound && updatedVessels.length > 0) {
              updatedVessels[0].isActive = true;
            }

            return { ...op, vessels: updatedVessels };
          })
        );
        setOperators(updatedOperators);
      }, [operators]);

      useEffect(() => {
        refreshVesselStatuses();
        const trackerTimer = setInterval(refreshVesselStatuses, 45000); // Check every 45s
        return () => clearInterval(trackerTimer);
      }, []);

      useEffect(() => {
        const timer = setInterval(() => setNow(new Date()), 1000);
        return () => clearInterval(timer);
      }, []);

      useEffect(() => {
        const fetchWeather = async () => {
          try {
            const response = await fetch(
              'https://api.open-meteo.com/v1/forecast?latitude=4.373&longitude=73.651&current=temperature_2m,weather_code,wind_speed_10m'
            );
            const data = await response.json();
            if (data && data.current) {
              const temp = Math.round(data.current.temperature_2m);
              const { condition, isBadWeather, type } = decodeWeatherCode(data.current.weather_code);
              setWeather({ temp: `${temp}`, condition, isBadWeather, type });
            }
          } catch (error) {
            console.error('Weather fetch error:', error);
            setWeather({ temp: '29', condition: 'Partly Cloudy', isBadWeather: false, type: 'cloudy' });
          }
        };

        fetchWeather();
        const weatherTimer = setInterval(fetchWeather, 600000); // Refresh weather every 10 min
        return () => clearInterval(weatherTimer);
      }, []);

      const isFriday = now.getDay() === 5;

      // Flatten and compute next trips across operators
      const sortedTrips = useMemo(() => {
        const currentHours = now.getHours();
        const currentMinutes = now.getMinutes();
        const currentTotalMinutes = currentHours * 60 + currentMinutes;

        const list = [];
        operators.forEach((op) => {
          const sched = isFriday ? op.fridaySchedule : op.regularSchedule;
          sched
            .filter((item) => item.route === activeRoute)
            .forEach((item) => {
              const [h, m] = item.time24.split(':').map(Number);
              const tripTotalMinutes = h * 60 + m;
              const diffMinutes = tripTotalMinutes - currentTotalMinutes;

              list.push({
                ...item,
                operatorName: op.name,
                operatorShort: op.shortName,
                dotColor: op.dotColor,
                operatorId: op.id,
                fare: op.fareOneWay,
                booking: op.booking,
                diffMinutes,
                isPast: diffMinutes < 0,
              });
            });
        });

        // Sort upcoming trips first, then past trips
        return list.sort((a, b) => {
          if (a.isPast && !b.isPast) return 1;
          if (!a.isPast && b.isPast) return -1;
          return a.diffMinutes - b.diffMinutes;
        });
      }, [operators, activeRoute, now, isFriday]);

      const formatCountdown = (diff) => {
        if (diff < 0) return 'Departed';
        const hrs = Math.floor(diff / 60);
        const mins = diff % 60;
        if (hrs > 0) return `in ${hrs}h ${mins}m`;
        if (mins === 0) return 'Boarding Now';
        return `in ${mins}m`;
      };

      return (
        <div className="max-w-md mx-auto min-h-screen flex flex-col justify-between relative pb-10 bg-white shadow-xl">
          {/* TOP HEADER & WEATHER BANNER */}
          <div className="relative bg-slate-900 text-white p-6 rounded-b-3xl overflow-hidden shadow-lg">
            <WeatherBackground weatherType={weather.type} />

            <div className="relative z-20 flex justify-between items-start">
              <div>
                <span className="text-[10px] uppercase tracking-widest font-bold text-sky-400 bg-sky-950/80 border border-sky-800/50 px-2.5 py-1 rounded-full">
                  Thulusdhoo Transport
                </span>
                <h1 className="text-2xl font-black mt-2 tracking-tight">Ferry Schedule</h1>
                <p className="text-xs text-slate-400 mt-0.5">Live tracking & speedboat departures</p>
              </div>

              {/* Weather Widget */}
              <div className="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-2.5 backdrop-blur-md text-right">
                <div className="text-lg font-black leading-none">{weather.temp}°C</div>
                <div className="text-[10px] text-slate-300 font-semibold mt-1">{weather.condition}</div>
                {weather.isBadWeather && (
                  <span className="mt-1 block text-[9px] font-bold text-amber-400 bg-amber-950/80 px-1.5 py-0.5 rounded">
                    ⚠️ Sea Caution
                  </span>
                )}
              </div>
            </div>

            {/* ROUTE TOGGLE SWITCH */}
            <div className="relative z-20 mt-6 grid grid-cols-2 gap-1.5 bg-slate-800/90 p-1.5 rounded-2xl border border-slate-700/50">
              <button
                onClick={() => setActiveRoute('MALE_TO_THULUSDHOO')}
                className={`py-2.5 rounded-xl text-xs font-bold transition-all ${
                  activeRoute === 'MALE_TO_THULUSDHOO'
                    ? 'bg-sky-500 text-white shadow-md'
                    : 'text-slate-400 hover:text-white'
                }`}
              >
                Malé → Thulusdhoo
              </button>
              <button
                onClick={() => setActiveRoute('THULUSDHOO_TO_MALE')}
                className={`py-2.5 rounded-xl text-xs font-bold transition-all ${
                  activeRoute === 'THULUSDHOO_TO_MALE'
                    ? 'bg-sky-500 text-white shadow-md'
                    : 'text-slate-400 hover:text-white'
                }`}
              >
                Thulusdhoo → Malé
              </button>
            </div>
          </div>

          {/* MAIN SCHEDULE LIST */}
          <div className="px-4 py-5 flex-1 space-y-3">
            <div className="flex justify-between items-center px-1">
              <span className="text-xs font-extrabold uppercase tracking-wider text-slate-400">
                {isFriday ? 'Friday Schedule' : 'Regular Timetable'}
              </span>
              <span className="text-xs font-bold text-slate-500">
                {now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
              </span>
            </div>

            {sortedTrips.length > 0 ? (
              sortedTrips.map((trip) => {
                const op = operators.find((o) => o.id === trip.operatorId);
                return (
                  <div
                    key={trip.id}
                    onClick={() => setSelectedOperator(op)}
                    className={`p-4 rounded-2xl border transition-all cursor-pointer flex items-center justify-between ${
                      trip.isPast
                        ? 'bg-slate-50 border-slate-100 opacity-50'
                        : trip.diffMinutes <= 30 && trip.diffMinutes >= 0
                        ? 'bg-amber-50/60 border-amber-200/80 shadow-sm'
                        : 'bg-white border-slate-100 shadow-sm hover:border-slate-300'
                    }`}
                  >
                    <div className="flex items-center gap-3.5">
                      <div className={`w-3 h-3 rounded-full ${trip.dotColor} shrink-0`}></div>
                      <div>
                        <div className="flex items-center gap-2">
                          <span className="text-base font-black text-slate-900 font-mono">{trip.time}</span>
                          <span className="text-xs font-bold text-slate-700">{trip.operatorShort}</span>
                        </div>
                        <span className="text-[11px] text-slate-400 font-medium block mt-0.5">
                          {trip.departure} to {trip.destination}
                        </span>
                      </div>
                    </div>

                    <div className="text-right">
                      <span
                        className={`text-xs font-black block ${
                          trip.isPast
                            ? 'text-slate-400'
                            : trip.diffMinutes <= 30
                            ? 'text-amber-600'
                            : 'text-emerald-600'
                        }`}
                      >
                        {formatCountdown(trip.diffMinutes)}
                      </span>
                      <span className="text-[10px] text-slate-400 font-bold block mt-0.5">{trip.fare}</span>
                    </div>
                  </div>
                );
              })
            ) : (
              <div className="text-center py-12 text-slate-400 text-xs">No ferries found for this route today.</div>
            )}
          </div>

          {/* SUPPLY / CARGO FERRIES BAR */}
          <div className="px-4 py-2">
            <span className="text-[10px] font-extrabold uppercase tracking-wider text-slate-400 block mb-2 px-1">
              Cargo & Supply Boats
            </span>
            <div className="grid grid-cols-2 gap-2">
              {SUPPLY_FERRIES.map((ferry) => (
                <button
                  key={ferry.id}
                  onClick={() => setSelectedSupplyFerry(ferry)}
                  className="p-3 bg-slate-50 border border-slate-200/80 hover:border-amber-400 rounded-2xl text-left transition-all shadow-sm"
                >
                  <span className="text-[10px] font-bold text-amber-700 bg-amber-100 px-2 py-0.5 rounded-full uppercase">
                    Cargo
                  </span>
                  <div className="font-extrabold text-xs text-slate-800 mt-1.5">{ferry.name}</div>
                  <div className="text-[10px] text-slate-400 font-medium mt-0.5">Tap for details ↗</div>
                </button>
              ))}
            </div>
          </div>

          {/* OPERATORS DIRECTORY FOOTER */}
          <div className="px-4 pt-3 pb-6">
            <span className="text-[10px] font-extrabold uppercase tracking-wider text-slate-400 block mb-2 px-1">
              All Speedboat Operators
            </span>
            <div className="flex gap-2 overflow-x-auto no-scrollbar pb-1">
              {operators.map((op) => (
                <button
                  key={op.id}
                  onClick={() => setSelectedOperator(op)}
                  className="px-3.5 py-2 bg-slate-100 hover:bg-slate-200 rounded-xl text-xs font-bold text-slate-700 whitespace-nowrap transition-colors border border-slate-200/60"
                >
                  {op.shortName}
                </button>
              ))}
            </div>
          </div>

          {/* MODALS */}
          {selectedOperator && (
            <ScheduleModal
              operator={selectedOperator}
              isFriday={isFriday}
              onClose={() => setSelectedOperator(null)}
            />
          )}

          {selectedSupplyFerry && (
            <SupplyModal
              ferry={selectedSupplyFerry}
              onClose={() => setSelectedSupplyFerry(null)}
            />
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
