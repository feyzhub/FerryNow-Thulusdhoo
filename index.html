<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thulusdhoo Ferry Finder</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & React DOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    /* Smooth scrolling and hidden scrollbars for clean UI */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-[#0a0f1d] text-white min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    // ==========================================
    // 1. DATA FILE (ferrySchedules.js)
    // ==========================================
    const FERRY_OPERATORS = [
      {
        id: "refcool",
        name: "Refcool",
        description: "Daily scheduled passenger ferry service.",
        contact: "+960 777-1234",
        fare: "MVR 250",
        schedule: [
          { id: "r1", time: "06:30 AM", time24: "06:30", route: "MALE_TO_THULUSDHOO", departure: "Malé", destination: "Thulusdhoo" },
          { id: "r2", time: "09:15 AM", time24: "09:15", route: "MALE_TO_THULUSDHOO", departure: "Malé", destination: "Thulusdhoo" },
          { id: "r3", time: "11:30 AM", time24: "11:30", route: "MALE_TO_THULUSDHOO", departure: "Malé", destination: "Thulusdhoo" },
          { id: "r4", time: "02:30 PM", time24: "14:30", route: "THULUSDHOO_TO_MALE", departure: "Thulusdhoo", destination: "Malé" },
          { id: "r5", time: "05:30 PM", time24: "17:30", route: "MALE_TO_THULUSDHOO", departure: "Malé", destination: "Thulusdhoo" },
          { id: "r6", time: "08:30 PM", time24: "20:30", route: "MALE_TO_THULUSDHOO", departure: "Malé", destination: "Thulusdhoo" },
        ],
      },
      {
        id: "tharika",
        name: "Tharika Express",
        description: "Fast transfers and regular island routes.",
        contact: "+960 777-5678",
        fare: "MVR 250",
        schedule: [
          { id: "t1", time: "07:00 AM", time24: "07:00", route: "MALE_TO_THULUSDHOO", departure: "Malé", destination: "Thulusdhoo" },
          { id: "t2", time: "09:15 AM", time24: "09:15", route: "MALE_TO_THULUSDHOO", departure: "Malé", destination: "Thulusdhoo" },
          { id: "t3", time: "12:15 PM", time24: "12:15", route: "MALE_TO_THULUSDHOO", departure: "Malé", destination: "Thulusdhoo" },
          { id: "t4", time: "04:00 PM", time24: "16:00", route: "MALE_TO_THULUSDHOO", departure: "Malé", destination: "Thulusdhoo" },
          { id: "t5", time: "06:30 PM", time24: "18:30", route: "THULUSDHOO_TO_MALE", departure: "Thulusdhoo", destination: "Malé" },
        ],
      },
      {
        id: "riverspeed",
        name: "River Speed",
        description: "Speedboat express services across the atoll.",
        contact: "+960 777-9999",
        fare: "MVR 300",
        schedule: [
          { id: "rv1", time: "08:00 AM", time24: "08:00", route: "MALE_TO_THULUSDHOO", departure: "Malé", destination: "Thulusdhoo" },
          { id: "rv2", time: "09:20 AM", time24: "09:20", route: "MALE_TO_THULUSDHOO", departure: "Malé", destination: "Thulusdhoo" },
          { id: "rv3", time: "02:00 PM", time24: "14:00", route: "MALE_TO_THULUSDHOO", departure: "Malé", destination: "Thulusdhoo" },
          { id: "rv4", time: "04:20 PM", time24: "16:20", route: "MALE_TO_THULUSDHOO", departure: "Malé", destination: "Thulusdhoo" },
          { id: "rv5", time: "07:00 PM", time24: "19:00", route: "MALE_TO_THULUSDHOO", departure: "Malé", destination: "Thulusdhoo" },
          { id: "rv6", time: "09:30 PM", time24: "21:30", route: "MALE_TO_THULUSDHOO", departure: "Malé", destination: "Thulusdhoo" },
        ],
      },
    ];

    // Helper to calculate ferry departure status based on real-time clock
    const getDepartureStatus = (time24, nextFerryTracker) => {
      const now = new Date();
      const currentMinutes = now.getHours() * 60 + now.getMinutes();

      const [hours, minutes] = time24.split(':').map(Number);
      const itemMinutes = hours * 60 + minutes;

      if (itemMinutes < currentMinutes) {
        return { status: 'Departed', isDeparted: true, style: 'bg-slate-800/60 text-slate-500 border-slate-700/50' };
      } else if (!nextFerryTracker.found) {
        nextFerryTracker.found = true;
        return { status: 'Next Ferry', isDeparted: false, style: 'bg-emerald-500/20 text-emerald-400 border-emerald-500/40 animate-pulse font-bold' };
      } else {
        return { status: 'Upcoming', isDeparted: false, style: 'bg-blue-500/20 text-blue-400 border-blue-500/40' };
      }
    };

    // ==========================================
    // 2. MODAL COMPONENT (ScheduleModal.jsx)
    // ==========================================
    const ScheduleModal = ({ operator, onClose }) => {
      if (!operator) return null;

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
          <div className="relative w-full max-w-md max-h-[85vh] flex flex-col bg-[#131d35] rounded-3xl border border-slate-700/60 shadow-2xl overflow-hidden text-white">
            
            <div className="p-5 border-b border-slate-800 flex items-center justify-between bg-[#0f172a]">
              <div>
                <div className="flex items-center gap-2">
                  <h2 className="text-xl font-black text-white">{operator.name}</h2>
                  <span className="px-2.5 py-0.5 text-[10px] font-bold bg-[#00a3e0] text-white rounded-full">
                    {operator.fare}
                  </span>
                </div>
                <p className="text-xs text-slate-400 mt-0.5">{operator.description}</p>
              </div>
              <button
                onClick={onClose}
                className="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center text-slate-400 hover:text-white transition-colors"
              >
                ✕
              </button>
            </div>

            <div className="p-5 overflow-y-auto space-y-3">
              <div className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">
                Full Operator Timetable
              </div>

              <div className="space-y-2.5">
                {operator.schedule.map((item) => (
                  <div
                    key={item.id}
                    className="flex items-center justify-between p-3.5 rounded-2xl bg-[#0a0f1d]/60 border border-slate-800"
                  >
                    <div className="flex items-center gap-3">
                      <span className="text-base font-bold text-white">
                        {item.time}
                      </span>
                      <div className="text-xs font-semibold text-slate-400">
                        {item.departure} → {item.destination}
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            <div className="p-4 bg-[#0f172a] border-t border-slate-800 flex items-center justify-between">
              <span className="text-xs text-slate-400">
                Contact: <strong className="text-slate-200">{operator.contact}</strong>
              </span>
              <button
                onClick={onClose}
                className="px-4 py-1.5 text-xs font-bold text-white bg-[#00a3e0] rounded-xl hover:bg-[#008ec3] transition-colors"
              >
                Close
              </button>
            </div>

          </div>
        </div>
      );
    };

    // ==========================================
    // 3. MAIN APP (App.jsx)
    // ==========================================
    function App() {
      const [selectedOperator, setSelectedOperator] = React.useState(null);
      const [activeRoute, setActiveRoute] = React.useState('MALE_TO_THULUSDHOO');
      const rollerRef = React.useRef(null);
      const nextFerryRef = React.useRef(null);

      // 1. Gather all trips for selected route, sorted chronologically
      const allTrips = React.useMemo(() => {
        let trips = [];
        FERRY_OPERATORS.forEach((operator) => {
          operator.schedule.forEach((trip) => {
            trips.push({
              ...trip,
              operatorName: operator.name,
            });
          });
        });

        const filtered = trips.filter((t) => t.route === activeRoute);
        return filtered.sort((a, b) => a.time24.localeCompare(b.time24));
      }, [activeRoute]);

      // 2. Separate into Departed vs Upcoming lists
      const nextFerryTracker = { found: false };
      const processedTrips = allTrips.map((item) => {
        const { status, isDeparted, style } = getDepartureStatus(item.time24, nextFerryTracker);
        return { ...item, status, isDeparted, style };
      });

      const departedTrips = processedTrips.filter((t) => t.isDeparted);
      const upcomingTrips = processedTrips.filter((t) => !t.isDeparted);

      // Limit display to 3 departed ferries + 5 upcoming ferries for the roller window
      const visibleDeparted = departedTrips.slice(-3);
      const visibleUpcoming = upcomingTrips.slice(0, 5);
      const rollerList = [...visibleDeparted, ...visibleUpcoming];

      // Function to auto-scroll/recenter onto the Next Ferry row
      const handleRecenter = () => {
        if (nextFerryRef.current) {
          nextFerryRef.current.scrollIntoView({
            behavior: 'smooth',
            block: 'center',
          });
        } else if (rollerRef.current) {
          rollerRef.current.scrollTo({ top: 0, behavior: 'smooth' });
        }
      };

      // Auto recenter on initial load and route changes
      React.useEffect(() => {
        setTimeout(() => handleRecenter(), 100);
      }, [activeRoute]);

      return (
        <div className="min-h-screen bg-[#0a0f1d] text-white flex justify-center p-4 sm:p-6 font-sans">
          <div className="w-full max-w-md space-y-6">
            
            {/* Header */}
            <div className="text-center space-y-1">
              <h1 className="text-2xl font-extrabold tracking-tight">Thulusdhoo Ferry Finder</h1>
              <p className="text-xs text-slate-400 font-medium">Wednesday, 16:13</p>
            </div>

            {/* Direction Tabs */}
            <div className="bg-[#121a2d] p-1.5 rounded-2xl border border-slate-800/80 flex gap-2">
              <button
                onClick={() => setActiveRoute('MALE_TO_THULUSDHOO')}
                className={`flex-1 py-3 text-xs font-bold rounded-xl transition-all ${
                  activeRoute === 'MALE_TO_THULUSDHOO'
                    ? 'bg-[#00a3e0] text-white shadow-lg shadow-cyan-500/20'
                    : 'text-slate-400 hover:text-white'
                }`}
              >
                Malé → Thulusdhoo
              </button>
              <button
                onClick={() => setActiveRoute('THULUSDHOO_TO_MALE')}
                className={`flex-1 py-3 text-xs font-bold rounded-xl transition-all ${
                  activeRoute === 'THULUSDHOO_TO_MALE'
                    ? 'bg-[#00a3e0] text-white shadow-lg shadow-cyan-500/20'
                    : 'text-slate-400 hover:text-white'
                }`}
              >
                Thulusdhoo → Malé
              </button>
            </div>

            {/* Next Available Ferry Card */}
            <div className="relative overflow-hidden bg-gradient-to-b from-[#131d35] to-[#0f172a] p-6 rounded-3xl border border-slate-700/50 shadow-2xl text-center space-y-3">
              <div className="inline-block px-3 py-1 rounded-full bg-[#00a3e0]/10 border border-[#00a3e0]/30 text-[#00a3e0] text-[10px] font-bold tracking-widest uppercase">
                Next Available Ferry
              </div>
              <div>
                <h3 className="text-[#00a3e0] font-semibold text-lg">
                  {upcomingTrips[0]?.operatorName || "River Speed"}
                </h3>
                <div className="text-5xl font-black tracking-tight text-white my-1">
                  {upcomingTrips[0]?.time || "4:20 PM"}
                </div>
              </div>
              <div className="inline-flex items-center px-4 py-1.5 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs font-semibold">
                Departs Soon
              </div>
            </div>

            {/* Ferry Operators */}
            <div className="space-y-3">
              <div className="flex items-center justify-between text-xs font-bold tracking-wider text-slate-400 uppercase">
                <span>Ferry Operators</span>
                <span className="text-[10px] text-slate-500 font-normal">Tap for full schedule</span>
              </div>

              <div className="grid grid-cols-3 gap-3">
                {FERRY_OPERATORS.map((operator) => (
                  <button
                    key={operator.id}
                    onClick={() => setSelectedOperator(operator)}
                    className="p-3 bg-[#131d35] hover:bg-[#1a2744] active:scale-95 border border-slate-800 hover:border-[#00a3e0]/60 rounded-2xl transition-all text-center group flex flex-col items-center justify-center gap-1.5 shadow-md"
                  >
                    <span className="text-xs font-bold text-slate-200 group-hover:text-[#00a3e0] transition-colors truncate w-full">
                      {operator.name}
                    </span>
                    <span className="text-[10px] text-slate-400 bg-slate-800/80 px-2 py-0.5 rounded-full border border-slate-700/50">
                      {operator.fare}
                    </span>
                  </button>
                ))}
              </div>
            </div>

            {/* ROLLING SCHEDULE ROLLER */}
            <div className="space-y-3">
              <div className="flex items-center justify-between text-xs font-bold tracking-wider text-slate-400 uppercase">
                <span>Schedule Roller</span>
                <button
                  onClick={handleRecenter}
                  className="text-[#00a3e0] hover:underline text-xs font-semibold tracking-wider"
                >
                  RECENTER
                </button>
              </div>

              {/* Scroll Window (Shows 3 Departed + 5 Scheduled) */}
              <div
                ref={rollerRef}
                className="space-y-2.5 max-h-[310px] overflow-y-auto no-scrollbar rounded-2xl p-1 bg-[#0a0f1d]/50"
              >
                {rollerList.length > 0 ? (
                  rollerList.map((item) => {
                    const isNext = item.status === 'Next Ferry';

                    return (
                      <div
                        key={item.id}
                        ref={isNext ? nextFerryRef : null}
                        className={`flex items-center justify-between p-4 border rounded-2xl transition-all ${
                          item.isDeparted
                            ? 'bg-[#131d35]/40 border-slate-800/40 opacity-50'
                            : isNext
                            ? 'bg-[#131d35] border-[#00a3e0]/60 shadow-lg shadow-cyan-500/10 scale-[1.01]'
                            : 'bg-[#131d35] border-slate-800'
                        }`}
                      >
                        <div>
                          <div className={`text-base font-bold ${item.isDeparted ? 'text-slate-400' : 'text-slate-100'}`}>
                            {item.time}
                          </div>
                          <div className="text-xs text-slate-400">{item.operatorName}</div>
                        </div>
                        <span className={`px-3 py-1 text-[11px] font-semibold rounded-lg border ${item.style}`}>
                          {item.status}
                        </span>
                      </div>
                    );
                  })
                ) : (
                  <div className="text-center text-xs text-slate-500 py-6">
                    No scheduled ferries found.
                  </div>
                )}
              </div>
            </div>

            {/* Modal Popup */}
            <ScheduleModal
              operator={selectedOperator}
              onClose={() => setSelectedOperator(null)}
            />

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
